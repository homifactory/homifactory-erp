<style>
  :root{
    --navy:#1B2740;--navy2:#172036;--blue:#2F6BE4;--blue-strong:#2057C9;--blue-soft:#EAF1FE;
    --ink:#151C2D;--muted:#6B7587;--line:#ECEEF3;--bg:#F5F7FB;--card:#FFFFFF;
    --green:#16A06B;--green-soft:#E4F6EE;--amber:#C2890F;--amber-soft:#FBF0DA;--red:#E0484B;--red-soft:#FCEBEB;
    --radius:18px;--radius-sm:12px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 22px -10px rgba(16,24,40,.12);
    --shadow-lg:0 24px 60px -14px rgba(16,24,40,.30)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;background:var(--bg);color:var(--ink);word-break:keep-all;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font-family:inherit;cursor:pointer}
  a,button,input,select,textarea,.card,.nav button,.seg button,.metric,.navbtn,.mem button{transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,transform .15s ease}
  .hidden{display:none!important}
  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 50% -10%,#1d2b4d 0%,#0B0F18 60%)}
  #login .box{width:392px;max-width:92vw;padding:34px 32px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:22px;backdrop-filter:blur(8px);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
  #login .brand{display:flex;justify-content:center;margin-bottom:22px}#login .brand img{width:220px;max-width:84%}
  #login h1{color:#fff;font-size:21px;margin:0 0 4px;text-align:center;font-weight:600;letter-spacing:-.02em}
  #login p.sub{color:#9AA3B0;margin:0 0 18px;font-size:13.5px;text-align:center}
  #login label{display:block;font-size:12.5px;color:#AEB3BB;margin:12px 0 5px;font-weight:600}
  #login input{width:100%;height:48px;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:0 14px;font-size:15px;outline:none;background:rgba(255,255,255,.06);color:#fff}
  #login input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,107,228,.25)}
  #login .btn{width:100%;height:50px;border-radius:12px;background:linear-gradient(180deg,#3B78EE,#2057C9);color:#fff;font-weight:700;font-size:15px;margin-top:20px;border:none;box-shadow:0 10px 22px -10px rgba(47,107,228,.8)}
  #login .btn:hover{filter:brightness(1.06)}
  #login .msg{margin-top:12px;font-size:13px;text-align:center;color:#F09595;min-height:16px}
  /* shell */
  #app{display:flex;height:100vh}
  .side{width:222px;flex:none;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;display:flex;flex-direction:column;padding:18px 14px;overflow:auto}
  .side .bd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:4px 6px 16px;letter-spacing:-.01em}.side .bd img{height:22px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border-radius:12px;color:#AFC0DC;font-size:14px;font-weight:600;text-align:left;background:none;border:none;margin-bottom:2px}
  .nav button:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav button.on{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  .nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:9px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
  .side .me{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;display:flex;align-items:center;gap:9px}
  .side .me .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#fff,#E9EFFB);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .side .me small{display:block;color:#9DB3D2;font-size:11px}
  .side .me .lo{margin-left:auto;color:#9DB3D2;font-size:12px;background:none;border:none}
  .side .me .lo:hover{color:#fff}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.02em}.top .date{color:var(--muted);font-size:13px;font-weight:500}
  .scroll{flex:1;overflow:auto;padding:24px 28px 56px}.wrap{max-width:1040px;margin:0 auto}
  h2.sec{font-size:12.5px;color:var(--muted);font-weight:700;margin:22px 2px 11px;text-transform:none;letter-spacing:.01em}h2.sec:first-child{margin-top:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;min-width:0}
.grid2>*{min-width:0}
  .hamb{display:none;background:none;border:none;font-size:22px;color:var(--ink);cursor:pointer;padding:0 2px;line-height:1}
  .sideov{display:none}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  @media(max-width:760px){
    .hamb{display:inline-flex}
    #app{display:block;height:auto}
    .side{position:fixed;top:0;left:0;bottom:0;width:236px;z-index:60;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.35)}
    .side.open{transform:translateX(0)}
    .main{min-height:100vh}
    .sideov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
    .sideov.show{display:block}
    .top{padding:12px 16px;position:sticky;top:0;z-index:40}
    .top h1{font-size:17px}
    .scroll{padding:16px 14px 64px;height:auto;overflow:visible}
    .wrap{max-width:100%}
    .card{padding:14px;border-radius:14px}
    .clock{padding:18px}.clock .t{font-size:36px}
    .punch{width:132px;height:132px;font-size:18px}
    .calcell{min-height:58px;padding:3px 4px}.calcell .dn{font-size:11px}.evchip{font-size:9px;padding:1px 3px}
    .caldow{font-size:11px;padding:6px 0}
    .modalbox{padding:18px}
    .mgrid{grid-template-columns:repeat(3,1fr)}
  }
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.card+.card{margin-top:14px}
  .clock{display:flex;flex-direction:column;align-items:center;padding:24px}
  .clock .t{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}.clock .d{color:var(--muted);font-size:13px;margin-top:2px}
  .punch{width:154px;height:154px;border-radius:50%;margin:20px 0 8px;border:none;background:radial-gradient(120% 120% at 30% 25%,#4a86f2 0%,var(--blue) 45%,var(--blue-strong) 100%);color:#fff;font-weight:800;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 16px 34px -12px rgba(47,107,228,.75),inset 0 0 0 8px rgba(255,255,255,.12)}
  .punch:hover{transform:translateY(-2px)}.punch:active{transform:translateY(0)}
  .punch.out{background:radial-gradient(120% 120% at 30% 25%,#f06d6f 0%,var(--red) 50%,#c23b3e 100%);box-shadow:0 16px 34px -12px rgba(224,72,75,.7),inset 0 0 0 8px rgba(255,255,255,.12)}.punch small{font-weight:600;font-size:11px;opacity:.9;margin-top:4px}
  .statrow{display:flex;gap:10px;width:100%;margin-top:8px}.stat{flex:1;background:var(--bg);border-radius:12px;padding:11px;text-align:center}
  .stat .l{font-size:11px;color:var(--muted)}.stat .v{font-size:15px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:none}
  .row .ttl{font-size:14px;font-weight:600}.row .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .badge2{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap}
  .b-green{background:var(--green-soft);color:var(--green)}.b-amber{background:var(--amber-soft);color:var(--amber)}.b-red{background:var(--red-soft);color:var(--red)}.b-blue{background:var(--blue-soft);color:var(--blue)}
  .field{margin-top:13px}.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,107,228,.13)}
  .field.two{display:flex;gap:10px}.field.two>div{flex:1}
  .seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;min-width:90px;padding:11px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--muted)}
  .seg button:hover{border-color:#D6DCE8}.seg button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
  .submit{width:100%;height:48px;border-radius:13px;background:linear-gradient(180deg,#3B78EE,var(--blue-strong));color:#fff;font-weight:700;font-size:15px;margin-top:16px;border:none;box-shadow:0 12px 24px -12px rgba(47,107,228,.8)}
  .submit:hover{filter:brightness(1.05)}.submit:active{transform:translateY(1px)}
  .act{display:flex;gap:8px}.act button{flex:1;height:40px;border-radius:11px;font-weight:700;font-size:13px;border:none}.ap{background:var(--green-soft);color:var(--green)}.ap:hover{background:#d6f0e4}.rj{background:var(--red-soft);color:var(--red)}.rj:hover{background:#f8dede}
  .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;text-align:center;box-shadow:var(--shadow)}
  .metric .v{font-size:26px;font-weight:800;letter-spacing:-.02em}.metric .l{font-size:12px;color:var(--muted);margin-top:2px}
  .deptcard{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:10px}.deptcard:last-child{margin-bottom:0}
  .dh{font-size:13px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:5px}.dh span{font-size:11px;color:var(--blue);background:var(--blue-soft);padding:2px 9px;border-radius:20px}
  .mem{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}.mem:last-child{border-bottom:none}
  .mem b{font-weight:600}.mem .r{color:var(--muted);font-size:12px;margin-left:5px}.mem button{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:9px;background:#fff;color:var(--muted);border:1px solid var(--line)}.mem button:hover{border-color:var(--blue);color:var(--blue)}
  .tditem{display:flex;align-items:center;gap:7px;padding:10px 0;border-bottom:1px solid var(--line)}.tditem:last-child{border-bottom:none}.tditem.done span{text-decoration:line-through;color:var(--muted)}.tdblock{border-bottom:1px solid var(--line)}.tdblock:last-child{border-bottom:none}.tdblock .tditem{border-bottom:none;align-items:flex-start;padding-bottom:6px}.tdblock .tditem>input[type=checkbox]{margin-top:2px}
  .tditem label{flex:1;display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}.tditem input{width:18px;height:18px;accent-color:var(--blue)}.xmini{color:var(--red);background:none;border:none;cursor:pointer;font-size:15px;font-weight:700;flex-shrink:0;white-space:nowrap}
  .todoadd{display:flex;gap:8px;margin-top:11px}.todoadd input{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13px;outline:none}.todoadd input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,107,228,.13)}.todoadd button{width:42px;border-radius:11px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;border:none}.todoadd button:hover{background:var(--blue-strong)}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:20px 0}
  .fldgrp{margin-bottom:4px}.fldgrp:last-child{margin-bottom:0}
  .fldhd{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink);margin:16px 2px 3px}
  .card .fldgrp:first-child .fldhd{margin-top:2px}
  .fldhd .cnt{font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:10px;padding:1px 8px}
  .calwrap{border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow);background:#fff}
  .calhead{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg);border-bottom:1px solid var(--line)}.caldow{text-align:center;padding:9px 0;font-size:12px;font-weight:700;color:var(--muted)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr)}.calcell{min-height:86px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 7px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}.calcell:nth-child(7n){border-right:none}
  .calcell:hover{background:#FAFBFE}.calcell.out{background:var(--bg)}.calcell.sel{background:var(--blue-soft)}.calcell .dn{font-size:12px;font-weight:600}.calcell.today .dn{background:var(--blue);color:#fff;border-radius:50%;width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center}
  .evchip{font-size:10px;font-weight:600;padding:2px 5px;border-radius:6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:17px;color:var(--ink)}.navbtn:hover{border-color:var(--blue);color:var(--blue)}
  .link{color:var(--blue);background:var(--blue-soft);border:none;border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:700}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:24px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 14px 34px -10px rgba(0,0,0,.5)}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .tdtag{font-size:11px;color:var(--muted);background:var(--bg);border-radius:8px;padding:3px 9px;font-weight:700;white-space:nowrap;display:inline-block;flex-shrink:0}
  .modalbg{position:fixed;inset:0;background:rgba(16,22,40,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:56px 16px;overflow:auto}
  .modalbox{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:520px;box-shadow:var(--shadow-lg)}
  .dtable{width:100%;border-collapse:collapse;font-size:13px}
  .dtable th{text-align:left;padding:9px 12px;color:var(--muted);font-weight:700;font-size:11.5px;border-bottom:1px solid var(--line);white-space:nowrap}
  .dtable td{padding:9px 12px;border-bottom:1px solid var(--line)}
  .dtable tbody tr:hover{background:var(--bg)}
  .dtable tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:none}
</style>
</head>

const _DOW={'일':'Sun','월':'Mon','화':'Tue','수':'Wed','목':'Thu','금':'Fri','토':'Sat'};
function _i18nLine(t){
  return t
   .replace(/(\d{4})년\s*(\d{1,2})월/g,'$1.$2')
   .replace(/(\d{1,2})월\s*(\d{1,2})일/g,'$1/$2')
   .replace(/\((일|월|화|수|목|금|토)\)/g,(m,d)=>'('+_DOW[d]+')')
   .replace(/\+(\d+)개\s*더/g,'+$1 more')
   .replace(/(\d+)\s*회(?![가-힣])/g,'$1x')
   .replace(/\s*님(?=$|\s|·)/g,'')
   .replace(/(\d+)\s*분(?![가-힣])/g,'$1min')
   .replace(/(\d+)\s*개(?![가-힣])/g,'$1').replace(/일정/g,'Schedule');
}
function translateWS(){
  if(workspace!=='id')return;
  const roots=[document.getElementById('app')].filter(Boolean);
  const seen=new Set();
  roots.forEach(root=>{
    if(seen.has(root))return; seen.add(root);
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
    const nodes=[];let n;while(n=w.nextNode())nodes.push(n);
    nodes.forEach(node=>{
      const raw=node.nodeValue; if(!raw)return; const t=raw.trim(); if(!t)return; if(!/[가-힣]/.test(t))return;
      let out;
      if(Object.prototype.hasOwnProperty.call(I18N_ID,t)) out=I18N_ID[t];
      else out=_i18nLine(t);
      if(out!==t){ node.nodeValue=raw.replace(t,out); }
    });
    root.querySelectorAll&&root.querySelectorAll('[placeholder]').forEach(el=>{const p=(el.getAttribute('placeholder')||'').trim();if(I18N_ID[p])el.setAttribute('placeholder',I18N_ID[p]);else if(/[가-힣]/.test(p))el.setAttribute('placeholder',_i18nLine(p));});
  });
}

function exportExpensesCSV(){
  const rows=window._exRows||[];const pm=window._projMap||{};
  if(!rows.length){toast('내보낼 내역이 없습니다');return;}
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const head=['지출일','프로젝트','프로젝트코드','대분류','소분류','결제수단','사용카드','금액','적요'];
  const lines=[head.join(',')];
  rows.forEach(e=>{lines.push([e.spend_date||'',(pm[e.project_code]?pm[e.project_code].name:''),e.project_code||'',e.category||'',e.subcategory||'',e.payment_method||'',e.card_label||'',(+e.amount||0),e.memo||''].map(q).join(','));});
  const csv='﻿'+lines.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='지출내역_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),8000);
  toast('CSV를 내보냈습니다');
}

async function viewDrive(){
  var cur=driveFolder||'';
  var fr=await sb.from('drive_folders').select('*').eq('parent',cur).order('name');
  var fl=await sb.from('drive_files').select('*').eq('folder',cur).order('created_at',{ascending:false});
  if(fr.error||fl.error){return `<div class="card"><div class="empty">드라이브를 불러오지 못했습니다. (초기 설정이 필요할 수 있습니다)</div></div>`;}
  var folders=fr.data||[],files=fl.data||[];
  var parts=cur?cur.split('/'):[];
  var crumb=`<a onclick="driveGo('')" style="cursor:pointer;color:var(--blue)">드라이브</a>`;var acc='';
  parts.forEach(function(p){acc=acc?acc+'/'+p:p;crumb+=` / <a onclick="driveGo('${encodeURIComponent(acc)}')" style="cursor:pointer;color:var(--blue)">${esc(p)}</a>`;});
  var folderRows=folders.map(function(f){return `<div class="row" style="cursor:pointer" onclick="driveGo('${encodeURIComponent(f.path)}')"><div style="flex:1"><div class="ttl">📁 ${esc(f.name)}</div></div><button class="xmini" onclick="event.stopPropagation();delDriveFolder('${f.id}','${encodeURIComponent(f.path)}')">×</button></div>`;}).join('');
  var fileRows=files.map(function(f){return `<div class="row"><div style="flex:1;cursor:pointer" onclick="dlDriveFile('${f.storage_path}','${encodeURIComponent(f.name)}')"><div class="ttl">📄 ${esc(f.name)}</div><div class="meta">${driveSize(f.size)}${f.created_by&&empMap[f.created_by]?' · '+esc(empMap[f.created_by]):''} · ${(f.created_at||'').slice(0,10)}</div></div><button class="xmini" onclick="delDriveFile('${f.id}','${f.storage_path}')">×</button></div>`;}).join('');
  var body=(folderRows+fileRows)||'<div class="empty">이 폴더가 비어 있습니다</div>';
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:10px;flex-wrap:wrap"><div class="meta" style="font-size:14px">${crumb}</div><div style="display:flex;gap:8px"><button onclick="newDriveFolder()" style="background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer">+ 폴더</button><label class="ap" style="cursor:pointer;display:inline-flex;align-items:center">파일 업로드<input type="file" multiple style="display:none" onchange="uploadDriveFiles(this.files)"></label></div></div><div class="card" style="max-width:820px">${body}</div>`;
}
async function newDriveFolder(){
  var name=prompt('폴더 이름을 입력하세요');if(!name)return;name=name.trim();if(!name)return;if(name.indexOf('/')>-1){toast('폴더 이름에 / 는 쓸 수 없습니다');return;}
  var path=driveFolder?driveFolder+'/'+name:name;
  var r=await sb.from('drive_folders').insert({path:path,name:name,parent:driveFolder||'',created_by:me.id});
  if(r.error){toast('폴더 생성 실패: '+r.error.message);return;}
  toast('폴더가 생성되었습니다');render();
}
async function uploadDriveFiles(files){
  if(!files||!files.length)return;
  toast('업로드 중...');
  for(var i=0;i<files.length;i++){
    var file=files[i];
    var ext=(file.name.indexOf('.')>-1)?('.'+file.name.split('.').pop().toLowerCase()):'';
    var key=((window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+'_'+Math.random().toString(36).slice(2)))+ext;
    var up=await sb.storage.from('drive').upload(key,file,{upsert:false});
    if(up.error){toast('업로드 실패: '+up.error.message);continue;}
    await sb.from('drive_files').insert({folder:driveFolder||'',name:file.name,storage_path:key,size:file.size,mime:file.type||null,created_by:me.id});
  }
  toast('업로드 완료');render();
}
async function dlDriveFile(path,name){
  var r=await sb.storage.from('drive').createSignedUrl(path,120,{download:decodeURIComponent(name)});
  if(r.error||!r.data){toast('다운로드 실패');return;}
  window.open(r.data.signedUrl,'_blank');
}
async function delDriveFile(id,path){
  if(!confirm('이 파일을 삭제할까요?'))return;
  await sb.storage.from('drive').remove([path]);
  await sb.from('drive_files').delete().eq('id',id);
  toast('삭제되었습니다');render();
}
async function delDriveFolder(id,path){
  path=decodeURIComponent(path);
  var f=await sb.from('drive_files').select('id').eq('folder',path).limit(1);
  var sub=await sb.from('drive_folders').select('id').eq('parent',path).limit(1);
  if((f.data&&f.data.length)||(sub.data&&sub.data.length)){alert('폴더가 비어있지 않습니다. 안의 파일/폴더를 먼저 삭제해 주세요.');return;}
  if(!confirm('이 폴더를 삭제할까요?'))return;
  await sb.from('drive_folders').delete().eq('id',id);
  toast('폴더가 삭제되었습니다');render();
}
function gdHeaders(){return {'Authorization':'Bearer '+window.gToken};}
function gdIsFolder(f){return f.mimeType==='application/vnd.google-apps.folder';}
function gdGoto(i){gdStack=gdStack.slice(0,i+1);render();}
function gdOpen(id,name,driveId){gdStack.push({id:id,name:decodeURIComponent(name),driveId:driveId||null});render();}
function gdSize(b){if(b==null||b==='')return '';b=+b;if(b<1024)return b+'B';if(b<1048576)return (b/1024).toFixed(0)+'KB';if(b<1073741824)return (b/1048576).toFixed(1)+'MB';return (b/1073741824).toFixed(2)+'GB';}
async function viewGDrive(){
  if(!window.gToken){return mailPermCard();}
  var cur=gdStack.length?gdStack[gdStack.length-1]:null;
  var crumb=`<a onclick="gdGoto(-1)" style="cursor:pointer;color:var(--blue)">드라이브</a>`;
  gdStack.forEach(function(n,i){crumb+=` / <a onclick="gdGoto(${i})" style="cursor:pointer;color:var(--blue)">${esc(n.name)}</a>`;});
  var rowsHtml='';
  try{
    if(!cur){
      var r=await fetch('https://www.googleapis.com/drive/v3/drives?pageSize=100&fields=drives(id,name)',{headers:gdHeaders()});
      if(r.status===401||r.status===403){return mailPermCard();}
      var j=r.ok?await r.json():{};
      var roots=[{id:'root',name:'내 드라이브',driveId:null}].concat((j.drives||[]).map(function(d){return {id:d.id,name:d.name,driveId:d.id};}));
      rowsHtml=roots.map(function(d){return `<div class="row" style="cursor:pointer" onclick="gdOpen('${d.id}','${encodeURIComponent(d.name)}','${d.driveId||''}')"><div class="ttl">${d.driveId?'🗂️':'📁'} ${esc(d.name)}</div></div>`;}).join('');
    }else{
      var q="'"+cur.id+"' in parents and trashed=false";
      var params='q='+encodeURIComponent(q)+'&pageSize=300&fields='+encodeURIComponent('files(id,name,mimeType,size,modifiedTime)')+'&orderBy=folder,name&supportsAllDrives=true&includeItemsFromAllDrives=true';
      if(cur.driveId){params+='&corpora=drive&driveId='+cur.driveId;}else{params+='&corpora=user';}
      var r2=await fetch('https://www.googleapis.com/drive/v3/files?'+params,{headers:gdHeaders()});
      if(r2.status===401||r2.status===403){return mailPermCard();}
      var j2=r2.ok?await r2.json():{files:[]};
      var files=j2.files||[];
      rowsHtml=files.map(function(f){
        if(gdIsFolder(f)){return `<div class="row" style="cursor:pointer" onclick="gdOpen('${f.id}','${encodeURIComponent(f.name)}','${cur.driveId||''}')"><div style="flex:1"><div class="ttl">📁 ${esc(f.name)}</div></div><button class="xmini" onclick="event.stopPropagation();gdDelete('${f.id}')">×</button></div>`;}
        return `<div class="row"><div style="flex:1;cursor:pointer" onclick="gdDownload('${f.id}','${encodeURIComponent(f.name)}')"><div class="ttl">📄 ${esc(f.name)}</div><div class="meta">${gdSize(f.size)}${f.modifiedTime?' · '+f.modifiedTime.slice(0,10):''}</div></div><button class="xmini" onclick="gdDelete('${f.id}')">×</button></div>`;
      }).join('');
    }
  }catch(e){return `<div class="card"><div class="empty">드라이브를 불러오지 못했습니다</div></div>`;}
  var body=rowsHtml||'<div class="empty">비어 있습니다</div>';
  var actions=cur?`<button onclick="gdNewFolder()" style="background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer">+ 폴더</button><label class="ap" style="cursor:pointer;display:inline-flex;align-items:center">파일 업로드<input type="file" multiple style="display:none" onchange="gdUpload(this.files)"></label>`:'<span class="meta" style="font-size:12px">폴더(공유 드라이브)를 선택하세요</span>';
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:10px;flex-wrap:wrap"><div class="meta" style="font-size:14px">${crumb}</div><div style="display:flex;gap:8px;align-items:center">${actions}</div></div><div class="card" style="max-width:820px">${body}</div>`;
}
async function gdNewFolder(){
  var cur=gdStack[gdStack.length-1];if(!cur)return;
  var name=prompt('폴더 이름');if(!name)return;name=name.trim();if(!name)return;
  var r=await fetch('https://www.googleapis.com/drive/v3/files?supportsAllDrives=true',{method:'POST',headers:{'Authorization':'Bearer '+window.gToken,'Content-Type':'application/json'},body:JSON.stringify({name:name,mimeType:'application/vnd.google-apps.folder',parents:[cur.id]})});
  if(!r.ok){toast('폴더 생성 실패');return;}
  toast('폴더 생성됨');render();
}
async function gdUpload(files){
  var cur=gdStack[gdStack.length-1];if(!cur||!files||!files.length)return;
  toast('업로드 중...');
  for(var i=0;i<files.length;i++){
    var file=files[i];
    var cr=await fetch('https://www.googleapis.com/drive/v3/files?supportsAllDrives=true',{method:'POST',headers:{'Authorization':'Bearer '+window.gToken,'Content-Type':'application/json'},body:JSON.stringify({name:file.name,parents:[cur.id]})});
    if(!cr.ok){toast('업로드 실패: '+file.name);continue;}
    var meta=await cr.json();
    var up=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+meta.id+'?uploadType=media&supportsAllDrives=true',{method:'PATCH',headers:{'Authorization':'Bearer '+window.gToken,'Content-Type':(file.type||'application/octet-stream')},body:file});
    if(!up.ok){toast('업로드 실패: '+file.name);}
  }
  toast('업로드 완료');render();
}
async function gdDownload(id,name){
  name=decodeURIComponent(name);toast('다운로드 준비 중...');
  var r=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media&supportsAllDrives=true',{headers:gdHeaders()});
  if(!r.ok){toast('이 파일은 직접 다운로드가 안 됩니다(구글 문서 등). Drive에서 열어주세요.');return;}
  var blob=await r.blob();var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},10000);
}
async function gdDelete(id){
  if(!confirm('삭제(휴지통으로 이동)할까요?'))return;
  var r=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?supportsAllDrives=true',{method:'PATCH',headers:{'Authorization':'Bearer '+window.gToken,'Content-Type':'application/json'},body:JSON.stringify({trashed:true})});
  if(!r.ok){toast('삭제 실패(권한 확인)');return;}
  toast('휴지통으로 이동');render();
}

/* ---------- 근태 공통 ---------- */
async function todayAtt(){const {data}=await sb.from('attendance').select('*').eq('employee_id',me.id).eq('work_date',todayStr()).maybeSingle();return data;}
async function punch(){
  const a=await todayAtt();
  if(!a) await sb.from('attendance').insert({employee_id:me.id,work_date:todayStr(),clock_in:new Date().toISOString(),status:'근무중'});
  else if(!a.clock_out) await sb.from('attendance').update({clock_out:new Date().toISOString(),status:'완료'}).eq('id',a.id);
  else await sb.from('attendance').update({reclock_in:new Date().toISOString(),clock_out:null,status:'근무중'}).eq('id',a.id);
  toast('근태 기록 완료');render();
}
async function punchReset(){const a=await todayAtt();if(a){await sb.from('attendance').delete().eq('id',a.id);}toast('오늘 기록을 초기화했습니다');render();}
function workDur(a){if(!a||!a.clock_in)return '—';const end=a.clock_out?new Date(a.clock_out):new Date();const ms=end-new Date(a.clock_in);if(ms<0)return '—';const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);return (h>0?h+'시간 ':'')+m+'분';}
function clockCard(a){
  const inT=a?fmtT(a.clock_in):'—', outT=a&&a.clock_out?fmtT(a.clock_out):'—';
  const state=!a?'punch':(a.clock_out?'punch out':'punch out');
  const label=!a?'출근하기':(a.clock_out?'다시 출근':'퇴근하기');
  const dis=false;
  const d=new Date();const days=['일','월','화','수','목','금','토'];
  return `<div class="card clock" style="height:100%"><div class="t" id="home-clock">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</div>
    <div class="d">${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]}) · ${esc(me.name)} 님</div>
    <button class="${a&&!a.clock_out?'punch out':'punch'}" ${dis?'disabled style=opacity:.6':''} onclick="punch()">${label}<small>${dis?'오늘 근무 종료':'클릭하여 기록'}</small></button>
    <div class="statrow"><div class="stat"><div class="l">출근</div><div class="v">${inT}</div></div>${a&&a.reclock_in?`<div class="stat"><div class="l">다시출근</div><div class="v">${fmtT(a.reclock_in)}</div></div>`:''}<div class="stat"><div class="l">퇴근</div><div class="v">${outT}</div></div><div class="stat"><div class="l">진행</div><div class="v">${a?workDur(a):'—'}</div></div></div></div>`;
}

window.pomo=window.pomo||{phase:'work',left:25*60,running:false,work:25,brk:5,done:0,focus1:null,focus2:null,focus3:null,focus4:null};
function pomoFmt(s){s=Math.max(0,s|0);const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}
function pomoBeep(){try{const ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.resume)ac.resume();const beep=(t,f)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);o.start(t);o.stop(t+0.36);};const n=ac.currentTime;beep(n,880);beep(n+0.45,880);beep(n+0.9,1175);setTimeout(()=>ac.close(),1700);}catch(e){}}
function pomoCard(todos){const p=window.pomo;
  const fopt=(sel)=>{
    const list=(todos||[]).slice();
    const _rk=t=>(t.top_rank==null?9999:Number(t.top_rank));
    const _top=list.filter(t=>t.priority==='최상').sort((a,b)=>_rk(a)-_rk(b)||String(a.created_at||'').localeCompare(String(b.created_at||'')));
    const _rest=list.filter(t=>t.priority!=='최상');
    const _o=(t,pre)=>`<option value="${t.id}" ${sel===t.id?'selected':''}>${pre||''}${esc(t.content)}</option>`;
    let h=`<option value="">— 없음 —</option>`;
    if(_top.length)h+=`<optgroup label="🔥 최우선">${_top.map((t,i)=>_o(t,(i+1)+'. ')).join('')}</optgroup>`;
    if(_rest.length)h+=`<optgroup label="그 외">${_rest.map(t=>_o(t)).join('')}</optgroup>`;
    return h;
  };const C=2*Math.PI*52;const total=(p.phase==='work'?p.work:p.brk)*60;const off=C*(1-(total?p.left/total:0));const col=p.phase==='work'?'#2E75B6':'#1E9E6A';const setv=p.work+'/'+p.brk;
  const opt=(w,b,l)=>`<option value="${w}/${b}" ${setv===w+'/'+b?'selected':''}>${l}</option>`;
  return `<div class="card" id="pomo-card" style="text-align:center;border:1px solid ${col}33;height:100%;display:flex;flex-direction:column;justify-content:center">
    <div style="font-weight:700;font-size:13px;color:var(--muted);margin-bottom:8px">뽀모도로 · <span id="pomo-phase" style="color:${col}">${p.phase==='work'?'집중':'휴식'}</span></div>
    <div style="position:relative;width:148px;height:148px;margin:0 auto">
      <svg width="148" height="148" viewBox="0 0 120 120" style="transform:rotate(-90deg)"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="9"></circle><circle id="pomo-ring" cx="60" cy="60" r="52" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"></circle></svg>
      <div id="pomo-time" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;letter-spacing:1px">${pomoFmt(p.left)}</div>
    </div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:14px">
      <button id="pomo-toggle" onclick="pomoToggle()" class="submit" style="width:auto;padding:9px 26px;margin:0">${p.running?'일시정지':'시작'}</button>
      <button onclick="pomoSkip()" style="background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer">건너뛰기</button>
      <button onclick="pomoReset()" style="background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer">리셋</button>
    </div>
    <div style="margin-top:12px;font-size:12px;color:var(--muted)">오늘 완료 <b id="pomo-count" style="color:var(--ink)">${p.done}</b>회 · <select onchange="var v=this.value.split('/');pomoSet(+v[0],+v[1])" style="border:1px solid var(--line);border-radius:7px;padding:3px 6px;font-size:12px;font-family:inherit">${opt(25,5,'25 / 5분')}${opt(50,10,'50 / 10분')}${opt(15,3,'15 / 3분')}</select></div>
    <div style="margin-top:14px;text-align:left">
      <div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px">🎯 집중 업무 (TO DO LIST에서 선택)</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div style="min-width:0"><div style="font-size:11px;color:var(--muted);margin-bottom:3px">1순위</div><select onchange="pomoSetFocus(1,this.value)" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)">${fopt(p.focus1)}</select></div>
        <div style="min-width:0"><div style="font-size:11px;color:var(--muted);margin-bottom:3px">2순위</div><select onchange="pomoSetFocus(2,this.value)" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)">${fopt(p.focus2)}</select></div>
        <div style="min-width:0"><div style="font-size:11px;color:var(--muted);margin-bottom:3px">3순위</div><select onchange="pomoSetFocus(3,this.value)" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)">${fopt(p.focus3)}</select></div>
        <div style="min-width:0"><div style="font-size:11px;color:var(--muted);margin-bottom:3px">4순위</div><select onchange="pomoSetFocus(4,this.value)" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)">${fopt(p.focus4)}</select></div>
      </div>
    </div>
  </div>`;}
function pomoSync(){const p=window.pomo;const el=document.getElementById('pomo-time');if(!el)return;el.textContent=pomoFmt(p.left);const col=p.phase==='work'?'#2E75B6':'#1E9E6A';const ph=document.getElementById('pomo-phase');if(ph){ph.textContent=p.phase==='work'?'집중':'휴식';ph.style.color=col;}const C=2*Math.PI*52,total=(p.phase==='work'?p.work:p.brk)*60,ring=document.getElementById('pomo-ring');if(ring){ring.style.strokeDashoffset=C*(1-(total?p.left/total:0));ring.style.stroke=col;}const b=document.getElementById('pomo-toggle');if(b)b.textContent=p.running?'일시정지':'시작';const c=document.getElementById('pomo-count');if(c)c.textContent=p.done;const card=document.getElementById('pomo-card');if(card)card.style.borderColor=col+'33';}
function pomoArm(){window.pomo.endAt=Date.now()+window.pomo.left*1000;}
function pomoTick(){const p=window.pomo;if(!p.running)return;const rem=Math.round((p.endAt-Date.now())/1000);p.left=rem>0?rem:0;if(rem<=0){if(p.phase==='work'){p.done++;p.phase='break';p.left=p.brk*60;toast('집중 완료! 휴식하세요 ☕');}else{p.phase='work';p.left=p.work*60;toast('휴식 끝! 다시 집중 💪');}p.endAt=Date.now()+p.left*1000;pomoBeep();}pomoSync();}
function pomoToggle(){const p=window.pomo;p.running=!p.running;if(p.running){if(p.left<=0)p.left=(p.phase==='work'?p.work:p.brk)*60;pomoArm();}pomoSync();}
function pomoSkip(){const p=window.pomo;if(p.phase==='work'){p.phase='break';p.left=p.brk*60;}else{p.phase='work';p.left=p.work*60;}if(p.running)pomoArm();pomoSync();}
function pomoReset(){const p=window.pomo;p.running=false;p.phase='work';p.left=p.work*60;pomoSync();}
function pomoSet(w,b){const p=window.pomo;p.work=w;p.brk=b;p.left=(p.phase==='work'?w:b)*60;if(p.running)pomoArm();pomoSync();}
function pomoSetFocus(n,id){window.pomo['focus'+n]=id||null;}
function clockTick(){const el=document.getElementById('home-clock');if(!el)return;const d=new Date();el.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
if(!window._pomoInt)window._pomoInt=setInterval(pomoTick,1000);
if(!window._clockInt)window._clockInt=setInterval(clockTick,1000);
if(!window._visBound){window._visBound=1;document.addEventListener('visibilitychange',function(){if(!document.hidden){pomoTick();clockTick();}});}
if(!window._mailInt)window._mailInt=setInterval(function(){if(me&&window.gToken)fetchMailUnread();},120000);

async function deptGoalsCard(){
  const ym=todayStr().slice(0,7);
  const r=await sb.from('dept_goals').select('*').eq('ym',ym);
  const gs=r.data||[];const byDept={};gs.forEach(g=>{byDept[g.dept]=Array.isArray(g.items)?g.items:[];});
  const fc={'경영':'#2F6BE4','마케팅':'#D85A30','공연 및 퍼포먼스':'#7F77DD','매니지먼트':'#16A06B','틱톡 라이브':'#111','컨텐츠':'#8A93A2'};
  const groups=GROUPS.map(d=>{
    const items=byDept[d]||[];const col=fc[d]||'#8A93A2';
    const _pcts=items.map(_goalPct);
    const _done=_pcts.filter(p=>p>=1).length,_tot=items.length,_pct=_tot?Math.round(_pcts.reduce((a,b)=>a+b,0)/_tot*100):0;
    const rows=items.length?items.map((it,i)=>{
      const tg=Number(it.tgt);
      if(tg>0){const cur=Number(it.cur)||0;const p=Math.round(Math.min(1,cur/tg)*100);
        return `<div class="tditem ${cur>=tg?'done':''}"><span style="flex:1;font-size:14px">${esc(it.t)}</span><input type="number" value="${cur}" ${me.is_admin?'':'disabled'} onchange="setDeptGoalCur('${encodeURIComponent(d)}',${i},this.value)" style="width:82px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;text-align:right;font-size:13px"><span style="font-size:13px;color:var(--muted);white-space:nowrap">/ ${esc(String(it.tgt))} · ${p}%</span>${me.is_admin?`<button class="xmini" style="color:var(--blue)" onclick="editDeptGoalI('${encodeURIComponent(d)}',${i})">수정</button><button class="xmini" onclick="delDeptGoalI('${encodeURIComponent(d)}',${i})">\u00d7</button>`:''}</div>`;}
      return `<div class="tditem ${it.d?'done':''}"><input type="checkbox" ${it.d?'checked':''} ${me.is_admin?'':'disabled'} onclick="toggleDeptGoal('${encodeURIComponent(d)}',${i})"><span style="flex:1;font-size:14px">${esc(it.t)}</span>${me.is_admin?`<button class="xmini" style="color:var(--blue)" onclick="editDeptGoalI('${encodeURIComponent(d)}',${i})">수정</button><button class="xmini" onclick="delDeptGoalI('${encodeURIComponent(d)}',${i})">\u00d7</button>`:''}</div>`;
    }).join(''):'<div class="empty" style="padding:6px 0">목표 미설정</div>';
    return `<div class="fldgrp"><div class="fldhd" style="--fc:${col}"><span style="width:4px;height:13px;border-radius:3px;background:${col};display:inline-block"></span>${esc(d)}<span class="cnt">${items.length}</span><div style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px"><div style="width:140px;height:6px;background:var(--line);border-radius:5px;overflow:hidden"><div style="width:${_pct}%;height:100%;background:${col};border-radius:5px"></div></div><span style="font-size:12px;font-weight:700;color:${_tot?col:'#9AA3B2'}">${_done}/${_tot} · ${_pct}%</span></div>${me.is_admin?`<button class="xmini" style="color:var(--blue);font-weight:700" onclick="addDeptGoal('${encodeURIComponent(d)}')">+ 추가</button>`:''}</div>${rows}</div>`;
  }).join('');
  return `<h2 class="sec" style="margin-top:0">📌 ${+ym.slice(5)}월 부서별 목표</h2><div class="card">${groups}</div>`;
}
function _goalPct(it){const tg=Number(it.tgt);if(tg>0)return Math.min(1,(Number(it.cur)||0)/tg);return it.d?1:0;}
async function _deptItems(d,ym){const r=await sb.from('dept_goals').select('items').eq('dept',d).eq('ym',ym).maybeSingle();return (r.data&&Array.isArray(r.data.items))?r.data.items:[];}
async function setDeptGoalCur(d,i,val){d=decodeURIComponent(d);const ym=todayStr().slice(0,7);const items=await _deptItems(d,ym);if(!items[i])return;const n=Number(val);items[i].cur=isNaN(n)?0:n;if(Number(items[i].tgt)>0)items[i].d=(items[i].cur>=Number(items[i].tgt));const {error}=await _deptSave(d,ym,items);if(error){toast('오류: '+error.message);return;}render();}
async function _deptSave(d,ym,items){return sb.from('dept_goals').upsert({dept:d,ym:ym,items:items,updated_by:me.id,updated_at:new Date().toISOString()},{onConflict:'dept,ym'});}
async function addDeptGoal(d){d=decodeURIComponent(d);const ym=todayStr().slice(0,7);const v=prompt(d+' 목표 추가');if(v===null)return;if(!v.trim())return;const tg=prompt('목표 수치 (숫자 입력 · 비우면 체크형 목표)','');if(tg===null)return;const items=await _deptItems(d,ym);const it={t:v.trim(),d:false};const tgn=Number(tg);if(tg.trim()!==''&&!isNaN(tgn)&&tgn>0){it.tgt=tgn;it.cur=0;}items.push(it);const {error}=await _deptSave(d,ym,items);if(error){toast('오류: '+error.message);return;}toast('목표가 추가되었습니다');render();}
async function toggleDeptGoal(d,i){d=decodeURIComponent(d);const ym=todayStr().slice(0,7);const items=await _deptItems(d,ym);if(!items[i])return;items[i].d=!items[i].d;await _deptSave(d,ym,items);render();}
async function editDeptGoalI(d,i){d=decodeURIComponent(d);const ym=todayStr().slice(0,7);const items=await _deptItems(d,ym);if(!items[i])return;const v=prompt('목표 수정',items[i].t);if(v===null)return;items[i].t=v.trim();const cur=items[i].tgt!=null?String(items[i].tgt):'';const tg=prompt('목표 수치 (숫자 · 비우면 체크형)',cur);if(tg!==null){const tgn=Number(tg);if(tg.trim()!==''&&!isNaN(tgn)&&tgn>0){items[i].tgt=tgn;if(items[i].cur==null)items[i].cur=0;}else{delete items[i].tgt;delete items[i].cur;}}await _deptSave(d,ym,items);render();}
async function delDeptGoalI(d,i){d=decodeURIComponent(d);const ym=todayStr().slice(0,7);const items=await _deptItems(d,ym);if(!items[i])return;if(!confirm('이 목표를 삭제할까요?'))return;items.splice(i,1);await _deptSave(d,ym,items);toast('삭제되었습니다');render();}

/* ---------- 8월 목표 보드 (임원 전용) ---------- */
const GOAL_YM='2026-08';
function canGoals(){return !!(me&&['윤호성','배수빈','최성용'].indexOf(me.name)>-1);}
function goalFmt(n,unit){
  n=Number(n||0);unit=unit||'';
  if(unit===''){
    if(n>=1000000){var v=n/1000000;return (Number.isInteger(v)?v:parseFloat(v.toFixed(2)))+'M';}
    if(n>=1000){var w=n/1000;return (Number.isInteger(w)?w:parseFloat(w.toFixed(1)))+'K';}
    return ''+n;
  }
  return n+unit;
}
function goalDeptStyle(key){
  if(key==='틱톡 라이브')return {pillBg:'#E6F1FB',pillTx:'#0C447C',accent:'#185FA5',title:'TIKTOK LIVE · 한국'};
  if(key==='HOMI (인도네시아)')return {pillBg:'#E1F5EE',pillTx:'#04342C',accent:'#0F6E56',title:'HOMI · 인도네시아 지사'};
  return {pillBg:'#FAECE7',pillTx:'#4A1B0C',accent:'#D85A30',title:'MARKETING'};
}
function goalKpiCard(g,accent){
  const cur=Number(g.current||0),tgt=Number(g.target||0);
  const pct=tgt>0?Math.min(100,Math.round(cur/tgt*100)):0;
  const growth=(g.baseline!=null&&Number(g.baseline)>0&&tgt>0)?Math.round(((tgt-Number(g.baseline))/Number(g.baseline))*1000)/10:null;
  const tgtDisp=goalFmt(tgt,g.unit||'');
  const meta=[];
  if(tgt>0)meta.push(pct+'% 달성');
  if(g.baseline!=null)meta.push('전월 '+goalFmt(g.baseline,g.unit||'')+(growth!=null?' ('+(growth>=0?'+':'')+growth+'%)':''));
  if(g.note)meta.push(esc(g.note));
  return `<div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px">
    <div style="font-size:13px;color:var(--muted)">${esc(g.label||'')}</div>
    <div style="display:flex;align-items:baseline;gap:5px;margin:5px 0 8px">
      <input type="number" step="any" value="${cur}" onchange="goalCur('${g.id}',this.value)" style="width:96px;font-size:19px;font-weight:800;color:var(--ink);border:none;border-bottom:1px solid var(--line);background:transparent;padding:0 0 2px">
      <span style="font-size:13px;color:var(--muted)">/ ${tgtDisp}</span>
    </div>
    <div style="height:6px;background:#EEF0F3;border-radius:99px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${pct>=100?'#16a34a':accent}"></div></div>
    <div class="meta" style="margin-top:6px">${meta.join(' · ')}</div>
  </div>`;
}
function goalNoteCard(g,accent){
  return `<div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><span style="width:7px;height:7px;border-radius:50%;background:${accent};flex:none"></span><span style="font-size:13px;font-weight:700;color:var(--ink)">${esc(g.label||'')}</span></div>
    ${g.note?`<div class="meta">${esc(g.note)}</div>`:''}
  </div>`;

function _fmtLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dateRange(f,t){const out=[];let d=new Date(f+'T00:00:00');const end=new Date(t+'T00:00:00');let n=0;while(d<=end&&n<62){out.push(_fmtLocal(d));d.setDate(d.getDate()+1);n++;}return out;}
function plusDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return _fmtLocal(d);}

    <div class="field"><label>행선지 (외근 시)</label><input id="dc-place" placeholder="외근 장소 / 행선지" value="${V('place')}"></div>

function docDetailRows(d){
  const p=d.payload||{};
  const f=(l,v)=>(v!==undefined&&v!==null&&v!=='')?`<div style="margin-top:10px"><div class="meta" style="font-weight:700;color:var(--ink)">${l}</div><div style="white-space:pre-wrap;margin-top:2px">${esc(String(v))}</div></div>`:'';
  if(d.doc_type==='야근·주말·외근') return f('근무 구분',p.kind)+f('일자',p.date)+f('시간',(p.start||'')+' ~ '+(p.end||''))+f('행선지',p.place)+f('대체 휴일',p.comp)+f('사유',p.reason);
  if(d.doc_type==='구매 상신'){const vlist=(p.vendors&&p.vendors.length)?p.vendors:(p.vendor?String(p.vendor).split(' | '):[]);const vhtml=vlist.length?`<div style="margin-top:10px"><div class="meta" style="font-weight:700;color:var(--ink)">구매처 (${vlist.length})</div>`+vlist.map(x=>{const u=esc(String(x));const isUrl=/^https?:\/\//i.test(String(x).trim());return `<div style="margin-top:2px">${isUrl?`<a href="${u}" target="_blank" rel="noopener" style="color:var(--blue);word-break:break-all">${u}</a>`:u}</div>`;}).join('')+`</div>`:'';return f('품목명',p.item)+f('수량',p.qty)+f('예상 금액',p.amount?Number(p.amount).toLocaleString()+'원':'')+vhtml+f('결제 수단',p.card)+f('사유',p.reason);}
  return f('지출 항목',p.cat)+f('카드 구분',p.card)+f('지출일',p.date)+f('금액',p.amount?Number(p.amount).toLocaleString()+'원':'')+f('사용처',p.vendor)+f('내역',p.reason);
}
const PAID_TYPES=['지출 결의','구매 상신'];
function payLabel(d){return d.doc_type==='구매 상신'
  ?{word:'구매',sec:'구매 상태',done:'🛒 구매완료',doneShort:'🛒구매완료',undone:'미구매',btn:'✔ 구매 완료 체크',cancel:'구매 취소'}
  :{word:'송금',sec:'송금 상태',done:'💸 송금완료',doneShort:'💸송금완료',undone:'미송금',btn:'✔ 송금 완료 체크',cancel:'송금 취소'};}
function paidTag(d){
  if(PAID_TYPES.indexOf(d.doc_type)<0)return '';
  const L=payLabel(d);
  if(d.paid)return ` · <span style="color:#16a34a;font-weight:700">${L.doneShort}</span>`;
  if(d.status==='승인')return ` · <span style="color:#f59e0b;font-weight:600">${L.undone}</span>`;
  return '';
}
function paidBlockHtml(dm){
  if(PAID_TYPES.indexOf(dm.doc_type)<0)return '';
  const L=payLabel(dm);
  const info=dm.paid?`<span style="color:#16a34a;font-weight:700">${L.done}</span><span class="meta">${esc(dm.paid_by||'')}${dm.paid_at?' · '+(dm.paid_at||'').slice(0,10):''}</span>`:`<span class="meta" style="color:#f59e0b;font-weight:600">${L.undone}</span>`;
  const btn=canFin()?`<button onclick="togglePaid('${dm.id}',${dm.paid?'true':'false'},'${L.word}')" style="border:1px solid var(--line);background:${dm.paid?'#fff':'var(--blue)'};color:${dm.paid?'var(--muted)':'#fff'};border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:13px">${dm.paid?L.cancel:L.btn}</button>`:'';
  return `<div style="margin-top:12px"><div class="meta" style="font-weight:700;color:var(--ink)">${L.sec}</div><div style="margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">${info}${btn}</div></div>`;
}
async function togglePaid(id,cur,word){
  if(!canFin()){toast('권한이 없습니다');return;}
  word=word||'송금';
  const paid=!cur;
  const upd=paid?{paid:true,paid_by:me.name,paid_at:new Date().toISOString()}:{paid:false,paid_by:null,paid_at:null};
  const {error}=await sb.from('documents').update(upd).eq('id',id);
  if(error){toast('오류: '+error.message);return;}
  toast(paid?word+' 완료로 표시했습니다':word+' 완료를 해제했습니다');render();
}

  }
  const b=document.getElementById('gcal-btn');if(b){b.disabled=false;b.textContent='🔄 구글 캘린더 동기화';}
}

  const i=ids.indexOf(id); if(i===-1)return;
  const j=i+dir; if(j<0||j>=ids.length)return;
  ids[i]=ids[j]; ids[j]=id;
  window._topIds=ids;
  for(let k=0;k<ids.length;k++){ await sb.from('todos').update({top_rank:k+1}).eq('id',ids[k]); }
  render();
}
window._dragTopId=null;
function dragTopStart(ev,id){window._dragTopId=id;try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',id);}catch(_){}}
function dragTopOver(ev,el){if(!window._dragTopId)return;ev.preventDefault();try{ev.dataTransfer.dropEffect='move';}catch(_){}if(el)el.style.boxShadow='inset 0 2px 0 0 #8A1C1C';}
function dragTopLeave(el){if(el)el.style.boxShadow='';}
function dragTopEnd(){window._dragTopId=null;document.querySelectorAll('.tdblock').forEach(b=>b.style.boxShadow='');}
async function dropTopTodo(ev,targetId,el){ev.preventDefault();if(el)el.style.boxShadow='';const dragId=window._dragTopId;window._dragTopId=null;if(!dragId||dragId===targetId)return;const ids=(window._topIds||[]).slice();const from=ids.indexOf(dragId),to=ids.indexOf(targetId);if(from===-1||to===-1)return;ids.splice(from,1);let t=ids.indexOf(targetId);if(from<to)t=t+1;ids.splice(t,0,dragId);window._topIds=ids;for(let k=0;k<ids.length;k++){await sb.from('todos').update({top_rank:k+1}).eq('id',ids[k]);}render();}
function groupTodoByField(items,compSet){
  if(!items.length)return '<div class="empty">오늘 TO DO LIST가 없습니다</div>';
  const order=['경영/전략','틱톡','마케팅','매니지먼트','그룹라이브','기타','개인','미지정'];
  const fc={'틱톡':'#111','그룹라이브':'#7F77DD','마케팅':'#D85A30','매니지먼트':'#16A06B','경영/전략':'#2F6BE4','기타':'#B07A2E','개인':'#C2410C','미지정':'#8A93A2'};
  const top=items.filter(t=>t.priority==='최상').slice().sort((a,b)=>{
    const ra=(a.top_rank==null?9999:Number(a.top_rank)), rb=(b.top_rank==null?9999:Number(b.top_rank));
    if(ra!==rb)return ra-rb;
    return String(a.created_at||'').localeCompare(String(b.created_at||''));
  });
  window._topIds=top.map(t=>t.id);
  const rest=items.filter(t=>t.priority!=='최상');
  let out='';
  if(top.length){out+=`<div class="fldgrp"><div class="fldhd" style="--fc:#8A1C1C"><span style="width:4px;height:13px;border-radius:3px;background:#8A1C1C;display:inline-block"></span>🔥 최우선<span class="cnt">${top.length}</span></div>${top.map((t,i)=>todoRow2(t,compSet,i+1,top.length)).join('')}</div>`;}
  const g={};rest.forEach(t=>{const f=t.field||'미지정';(g[f]=g[f]||[]).push(t);});
  const keys=[...order.filter(k=>g[k]),...Object.keys(g).filter(k=>!order.includes(k))];
  out+=keys.map(k=>`<div class="fldgrp"><div class="fldhd" style="--fc:${fc[k]||'#8A93A2'}"><span style="width:4px;height:13px;border-radius:3px;background:${fc[k]||'#8A93A2'};display:inline-block"></span>${esc(k)}<span class="cnt">${g[k].length}</span></div>${g[k].map(t=>todoRow2(t,compSet)).join('')}</div>`).join('');
  return out;
}
function recurBlock(defs){
  const groups=[['daily','매일'],['weekly','매주'],['monthly','매월']];
  const html=groups.map(([rt,lbl])=>{
    const items=defs.filter(t=>t.recur_type===rt);
    if(!items.length)return '';
    const rows=items.map(t=>{
      const cad=rt==='daily'?'매일':rt==='weekly'?('매주 '+(WD[t.weekday]||'?')+'요일'):('매월 '+(t.weekday||'?')+'일');
      return `<div class="row" style="cursor:pointer" onclick="openTodoModal('${t.id}')"><div style="flex:1"><div class="ttl">${esc(t.content)}</div><div class="meta">${cad}${t.field?' · '+esc(t.field):''}</div></div>${fieldPill(t)}<button class="xmini" onclick="event.stopPropagation();delTodo('${t.id}')">×</button></div>`;
    }).join('');
    return `<div class="fldgrp"><div class="fldhd"><span style="width:4px;height:13px;border-radius:3px;background:var(--blue);display:inline-block"></span>${lbl}<span class="cnt">${items.length}</span></div>${rows}</div>`;
  }).join('');
  return html||'<div class="empty">설정된 정기 업무가 없습니다</div>';
}

function leaveUnitDays(type,start,end){if(type==='반차')return 0.5;return dateRange(start,end||start).length;}
async function bumpUsedDays(empId,type,start,end,sign){if(!empId)return;const yr=Number(String(start||'').slice(0,4))||new Date().getFullYear();const days=leaveUnitDays(type,start,end)*sign;const {data:b}=await sb.from('leave_balances').select('*').eq('employee_id',empId).eq('year',yr).maybeSingle();const cur=b?Number(b.used_days||0):0;const tot=b?Number(b.total_days||0):15;const nu=Math.max(0,Math.round((cur+days)*10)/10);await sb.from('leave_balances').upsert({employee_id:empId,year:yr,total_days:tot,used_days:nu});}
async function decideLeave(id,ok,empId,type,start){
  const {data:req}=await sb.from('leave_requests').select('*').eq('id',id).maybeSingle();
  const already=req&&req.status==='승인';
  await sb.from('leave_requests').update({status:ok?'승인':'반려',approver_id:me.id,decided_at:new Date().toISOString()}).eq('id',id);
  if(ok){
    if(req&&!already){await bumpUsedDays(req.employee_id,req.leave_type,req.start_date,req.end_date,1);}
    const {data:upd}=await sb.from('events').update({event_type:'휴가'}).eq('leave_id',id).select('id');
    if((!upd||!upd.length)&&empId){const {data:emp}=await sb.from('employees').select('name').eq('id',empId).maybeSingle();await sb.from('events').insert({title:(emp?emp.name:'')+' '+type,event_date:start,event_type:'휴가',employee_id:empId,created_by:me.id,leave_id:id});}
  }else{
    if(already){await bumpUsedDays(req.employee_id,req.leave_type,req.start_date,req.end_date,-1);}
    await sb.from('events').delete().eq('leave_id',id);
  }
  toast(ok?'승인 · 캘린더 반영':(already?'반려 · 사용 연차 복구':'반려 · 캘린더에서 제거'));await refreshBadges();render();
}

window._meetAudio=null;let _mr=null,_mrChunks=[],_sr=null,_recOn=false;
async function meetRecToggle(){ if(_recOn) await meetRecStop(); else await meetRecStart(); }
async function meetRecStart(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    _mrChunks=[];_mr=new MediaRecorder(stream);
    _mr.ondataavailable=e=>{if(e.data&&e.data.size)_mrChunks.push(e.data);};
    _mr.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(_mrChunks,{type:_mr.mimeType||'audio/webm'});
      const stat=document.getElementById('mt-recstat'); if(stat)stat.textContent='업로드 중…';
      const path=`${me.id}/${Date.now()}.webm`;
      const up=await sb.storage.from('meeting-audio').upload(path,blob,{contentType:blob.type});
      if(up.error){toast('녹음 저장 실패: '+up.error.message);if(stat)stat.textContent='저장 실패';}
      else{window._meetAudio=path;if(stat)stat.textContent='녹음 저장됨 ('+Math.round(blob.size/1024)+'KB)';}
    };
    _mr.start();
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SR){_sr=new SR();_sr.lang='ko-KR';_sr.continuous=true;_sr.interimResults=false;
      _sr.onresult=e=>{let txt='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)txt+=e.results[i][0].transcript+' ';}if(txt){const c=document.getElementById('mt-content');if(c)c.value=(c.value?c.value+' ':'')+txt.trim();}};
      _sr.onend=()=>{if(_recOn){try{_sr.start();}catch(e){}}};
      try{_sr.start();}catch(e){}
    }
    _recOn=true;
    const b=document.getElementById('mt-recbtn');if(b){b.textContent='■ 녹음 정지';b.style.background='var(--ink)';}
    const stat=document.getElementById('mt-recstat');if(stat)stat.textContent='녹음 중…';
  }catch(err){toast('마이크 접근 실패: '+(err.message||err));}
}
async function meetRecStop(){
  _recOn=false;
  if(_sr){try{_sr.stop();}catch(e){}_sr=null;}
  if(_mr&&_mr.state!=='inactive'){try{_mr.stop();}catch(e){}}
  const b=document.getElementById('mt-recbtn');if(b){b.textContent='● 녹음 시작';b.style.background='var(--red)';}
}

  const {data:emps}=await sb.from('emp_dir').select('id,name').order('name');
  const cats=['TIKTOK','그룹라이브','BENEFIT','마케팅','공연','매니지먼트','업무','기타'];
  const rowHtml=(a)=>{const vt=(a.visibility&&a.visibility!=='전체')?` <span class="tdtag">${a.visibility==='부서'?'부서 한정':'지정 공개'}</span>`:'';return `<div class="row"><div style="flex:1"><div class="ttl"><span style="color:#E8A300">${arStars(a.impact)}</span> ${a.url?`<a href="${esc(a.url)}" target="_blank" style="color:var(--blue)">${esc(a.title)}</a>`:esc(a.title)}${a.file_path?` <button class="xmini" style="color:var(--blue)" onclick="openArchiveFile('${a.file_path}')">📎 ${esc(a.file_name||'파일')}</button>`:''}${vt}</div>${a.note?`<div class="meta">${esc(a.note)}</div>`:''}</div><div style="display:flex;align-items:center;gap:8px"><span class="meta">${(a.created_at||'').slice(0,10)}</span><button class="xmini" style="color:var(--blue)" onclick="startArcEdit('${a.id}')">수정</button><button class="xmini" onclick="delArchive('${a.id}')">×</button></div></div>`;};
  const byCat={};(arc||[]).forEach(a=>{const c=a.category||'기타';(byCat[c]=byCat[c]||[]).push(a);});
  const catOrder=[...cats.filter(c=>byCat[c]),...Object.keys(byCat).filter(c=>!cats.includes(c))];
  const arows=catOrder.length?catOrder.map(c=>`<div class="fldgrp"><div class="fldhd"><span style="width:4px;height:14px;border-radius:3px;background:var(--blue);display:inline-block"></span>${esc(c)}<span class="cnt">${byCat[c].length}</span></div>${byCat[c].map(rowHtml).join('')}</div>`).join(''):'<div class="empty">등록된 자료가 없습니다</div>';
  const editing=arcEdit?(arc||[]).find(a=>a.id===arcEdit):null;
  const catOptsE=cats.map(c=>`<option ${editing&&editing.category===c?'selected':''}>${c}</option>`).join('');
  const impVal=editing?(editing.impact||3):3;
  const impOpts=[3,2,1].map(n=>`<option value="${n}" ${impVal===n?'selected':''}>${'★'.repeat(n)}</option>`).join('');
  const visVal=editing?(editing.visibility||'전체'):'전체';
  const visOpts=[['전체','전체 공개'],['부서','특정 부서만'],['지정','특정 사람만']].map(o=>`<option value="${o[0]}" ${visVal===o[0]?'selected':''}>${o[1]}</option>`).join('');
  const curDepts=(editing&&editing.target_depts)?editing.target_depts:[];
  const curPeople=(editing&&editing.target_people)?editing.target_people:[];
  const deptChecks=GROUPS.map(g=>`<label style="display:inline-flex;align-items:center;gap:4px;margin:4px 10px 4px 0;font-size:13px"><input type="checkbox" class="ar-dept" value="${esc(g)}" ${curDepts.includes(g)?'checked':''}>${esc(g)}</label>`).join('');
  const peopleChecks=(emps||[]).map(e=>`<label style="display:inline-flex;align-items:center;gap:4px;margin:4px 10px 4px 0;font-size:13px"><input type="checkbox" class="ar-person" value="${e.id}" ${curPeople.includes(e.id)?'checked':''}>${esc(e.name)}</label>`).join('');
  const modal=arcModal?`<div class="modalbg" onclick="if(event.target===this){arcModal=false;arcEdit=null;render()}"><div class="modalbox">
    <div style="font-weight:700;font-size:16px;margin-bottom:6px">${editing?'자료 · 메뉴얼 수정':'자료 · 메뉴얼 추가'}</div>
    <div class="field"><label>제목</label><input id="ar-title" placeholder="제목" value="${editing?esc(editing.title):''}"></div>
    <div class="field two"><div><label>분야(부서)</label><select id="ar-cat">${catOptsE}</select></div><div><label>임팩트</label><select id="ar-impact">${impOpts}</select></div></div>
    <div class="field"><label>링크</label><input id="ar-url" placeholder="https://" value="${editing&&editing.url?esc(editing.url):''}"></div>
    <div class="field"><label>파일 첨부 (PPT·PDF·Excel 등)${editing&&editing.file_name?` · 현재: ${esc(editing.file_name)}`:''}</label><input type="file" id="ar-file" accept=".ppt,.pptx,.pdf,.xls,.xlsx,.doc,.docx,.csv,image/*"></div>
    <div class="field"><label>공개 대상</label><select id="ar-vis" onchange="arcVis()">${visOpts}</select></div>
    <div class="field" id="ar-deptbox" style="display:${visVal==='부서'?'':'none'}"><label>공개 부서 선택</label><div>${deptChecks}</div></div>
    <div class="field" id="ar-peoplebox" style="display:${visVal==='지정'?'':'none'}"><label>공개 사람 선택</label><div>${peopleChecks}</div></div>
    <div class="field"><label>코멘트</label><textarea id="ar-note" rows="2">${editing&&editing.note?esc(editing.note):''}</textarea></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button onclick="arcModal=false;arcEdit=null;render()" style="background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer">취소</button>${editing?`<button class="ap" onclick="saveArchive()">수정 저장</button>`:`<button class="ap" onclick="addArchive()">저장</button>`}</div>
  </div></div>`:'';
  return `<div style="max-width:760px;margin:0 auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h2 class="sec" style="margin:0">자료 · 메뉴얼 (${(arc||[]).length})</h2>
      <button onclick="arcEdit=null;arcModal=true;render()" style="background:var(--blue);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer">+ 추가</button>
    </div>
    <div class="card">${arows}</div>
  </div>${modal}`;
}
async function addArchive(){
  const t=$('ar-title').value.trim();if(!t){toast('제목을 입력하세요');return;}
  const vis=$('ar-vis')?$('ar-vis').value:'전체';
  let target_depts=null,target_people=null;
  if(vis==='부서'){target_depts=[...document.querySelectorAll('.ar-dept:checked')].map(c=>c.value);if(!target_depts.length){toast('공개할 부서를 선택하세요');return;}}
  if(vis==='지정'){target_people=[...document.querySelectorAll('.ar-person:checked')].map(c=>c.value);if(!target_people.length){toast('공개할 사람을 선택하세요');return;}}
  let file_path=null,file_name=null;
  const fi=$('ar-file');
  if(fi&&fi.files&&fi.files[0]){const f=fi.files[0];const ext=(f.name.split('.').pop()||'dat').toLowerCase();file_path=`${me.id}/${Date.now()}.${ext}`;file_name=f.name;const up=await sb.storage.from('archive-files').upload(file_path,f,{contentType:f.type});if(up.error){toast('파일 업로드 실패: '+up.error.message);return;}}
  const {error}=await sb.from('archives').insert({title:t,category:$('ar-cat').value,impact:Number($('ar-impact').value||3),url:$('ar-url').value,note:$('ar-note').value,file_path,file_name,visibility:vis,target_depts,target_people,created_by:me.id});
  if(error){toast('오류: '+error.message);return;}
  arcModal=false;toast('자료가 추가되었습니다');render();
}
function startArcEdit(id){arcEdit=id;arcModal=true;render();}
async function saveArchive(){
  const t=$('ar-title').value.trim();if(!t){toast('제목을 입력하세요');return;}
  const vis=$('ar-vis')?$('ar-vis').value:'전체';
  let target_depts=null,target_people=null;
  if(vis==='부서'){target_depts=[...document.querySelectorAll('.ar-dept:checked')].map(c=>c.value);if(!target_depts.length){toast('공개할 부서를 선택하세요');return;}}
  if(vis==='지정'){target_people=[...document.querySelectorAll('.ar-person:checked')].map(c=>c.value);if(!target_people.length){toast('공개할 사람을 선택하세요');return;}}
  const upd={title:t,category:$('ar-cat').value,impact:Number($('ar-impact').value||3),url:$('ar-url').value,note:$('ar-note').value,visibility:vis,target_depts,target_people};
  const fi=$('ar-file');
  if(fi&&fi.files&&fi.files[0]){const f=fi.files[0];const ext=(f.name.split('.').pop()||'dat').toLowerCase();const path=`${me.id}/${Date.now()}.${ext}`;const up=await sb.storage.from('archive-files').upload(path,f,{contentType:f.type});if(up.error){toast('파일 업로드 실패: '+up.error.message);return;}upd.file_path=path;upd.file_name=f.name;}
  const {error}=await sb.from('archives').update(upd).eq('id',arcEdit);
  if(error){toast('오류: '+error.message);return;}
  arcModal=false;arcEdit=null;toast('수정되었습니다');render();
}
async function openArchiveFile(path){const isHtml=/\.html?$/i.test(path);const w=isHtml?window.open('','_blank'):null;const {data,error}=await sb.storage.from('archive-files').createSignedUrl(path,180);if(error||!data){if(w)w.close();toast('파일을 열 수 없습니다');return;}if(isHtml){try{const res=await fetch(data.signedUrl);const html=await res.text();const blob=new Blob([html],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);if(w){w.location.href=url;}else{window.open(url,'_blank');}setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(e){if(w){w.location.href=data.signedUrl;}else{window.open(data.signedUrl,'_blank');}}return;}window.open(data.signedUrl,'_blank');}
async function delArchive(id){await sb.from('archives').delete().eq('id',id);render();}

/* ---------- 마이페이지 ---------- */
async function viewMyPage(){
  const {data:{user}}=await sb.auth.getUser();
  return `<h2 class="sec">내 정보</h2><div class="card" style="max-width:520px">
    <div class="row"><div class="meta">이름</div><div class="ttl">${esc(me.name||'')}</div></div>
    <div class="row"><div class="meta">이메일</div><div class="ttl">${esc(user?user.email:'')}</div></div>
    <div class="row"><div class="meta">부서 · 직급</div><div class="ttl">${esc(me.dept||'')} ${esc(me.role||'')}${me.is_admin?' · 관리자':''}</div></div>
  </div>
  <h2 class="sec">비밀번호 변경</h2><div class="card" style="max-width:520px">
    <div class="field"><label>새 비밀번호</label><input type="password" id="np1" placeholder="새 비밀번호 (8자 이상 권장)"></div>
    <div class="field"><label>새 비밀번호 확인</label><input type="password" id="np2" placeholder="다시 입력"></div>
    <button class="submit" onclick="changePw()">비밀번호 변경</button>
    <div class="meta" id="pwmsg" style="margin-top:10px"></div>
  </div>`;
}
async function changePw(){
  const a=$('np1').value,b=$('np2').value,m=$('pwmsg');m.style.color='var(--muted)';m.textContent='';
  if(!a||a.length<6){m.style.color='var(--red)';m.textContent='6자 이상 입력하세요';return;}
  if(a!==b){m.style.color='var(--red)';m.textContent='두 비밀번호가 일치하지 않습니다';return;}
  const {error}=await sb.auth.updateUser({password:a});
  if(error){m.style.color='var(--red)';m.textContent='오류: '+error.message;return;}
  m.style.color='var(--green)';m.textContent='✓ 비밀번호가 변경되었습니다';$('np1').value='';$('np2').value='';
}

/* ---------- 로그인 ---------- */
async function doLogin(){
  const email=$('email').value.trim(),pw=$('pw').value;const m=$('lmsg');m.textContent='';
  if(!email||!pw){m.textContent='이메일과 비밀번호를 입력하세요';return;}
  $('loginBtn').disabled=true;$('loginBtn').textContent='로그인 중…';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  $('loginBtn').disabled=false;$('loginBtn').textContent='로그인';
  if(error){m.textContent='로그인 실패: '+error.message;return;}
  afterLogin(data.user);
}
$('loginBtn').onclick=doLogin;
$('googleBtn').onclick=async()=>{
  const m=$('lmsg');m.textContent='';
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin,scopes:'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/gmail.labels https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/gmail.send',queryParams:{hd:'homifactory.com',prompt:'consent',access_type:'offline'}}});
  if(error){m.textContent='구글 로그인 실패: '+error.message;}
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('logout').onclick=async()=>{await sb.auth.signOut();showLogin();};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='td-in')addTodo();});
sb.auth.getSession().then(({data})=>{if(data.session){if(data.session.provider_token)_gtokSave(data.session.provider_token);else _gtokLoad();afterLogin(data.session.user);}});
sb.auth.onAuthStateChange((ev,session)=>{if(session&&session.provider_token)_gtokSave(session.provider_token);});
