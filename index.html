<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>호미팩토리 ERP</title>
<style>
  :root{--navy:#1F3864;--blue:#2E75B6;--blue-soft:#E8F0FA;--ink:#1B2330;--muted:#6B7686;--line:#E6E9EF;--bg:#F4F6FA;
    --green:#1E9E6A;--green-soft:#E3F5EC;--amber:#C98A12;--amber-soft:#FBF1DD;--red:#D64545;--red-soft:#FBEAEA;
    --shadow:0 1px 2px rgba(20,30,50,.05),0 6px 20px rgba(20,30,50,.05)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;background:var(--bg);color:var(--ink);word-break:keep-all}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}
  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0B0B0D}
  #login .box{width:380px;max-width:92vw;padding:30px}
  #login .brand{display:flex;justify-content:center;margin-bottom:20px}#login .brand img{width:220px;max-width:84%}
  #login h1{color:#fff;font-size:21px;margin:0 0 4px;text-align:center;font-weight:500}
  #login p.sub{color:#9AA3B0;margin:0 0 18px;font-size:13.5px;text-align:center}
  #login label{display:block;font-size:12.5px;color:#AEB3BB;margin:12px 0 5px;font-weight:600}
  #login input{width:100%;height:46px;border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:0 13px;font-size:15px;outline:none;background:rgba(255,255,255,.06);color:#fff}
  #login input:focus{border-color:var(--blue)}
  #login .btn{width:100%;height:48px;border-radius:11px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;margin-top:20px;border:none}
  #login .msg{margin-top:12px;font-size:13px;text-align:center;color:#F09595;min-height:16px}
  /* shell */
  #app{display:flex;height:100vh}
  .side{width:212px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:16px 12px;overflow:auto}
  .side .bd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:4px 6px 14px}.side .bd img{height:22px}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;color:#C7D6EC;font-size:14px;font-weight:600;text-align:left;background:none;border:none}
  .nav button.on{background:rgba(255,255,255,.14);color:#fff}
  .nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:9px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
  .side .me{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:12px;display:flex;align-items:center;gap:9px}
  .side .me .av{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .side .me small{display:block;color:#9DB3D2;font-size:11px}
  .side .me .lo{margin-left:auto;color:#9DB3D2;font-size:12px;background:none;border:none}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;background:#fff;border-bottom:1px solid var(--line)}
  .top h1{font-size:18px;margin:0}.top .date{color:var(--muted);font-size:13px}
  .scroll{flex:1;overflow:auto;padding:22px 26px 50px}.wrap{max-width:1000px;margin:0 auto}
  h2.sec{font-size:13px;color:var(--muted);font-weight:700;margin:20px 2px 10px}h2.sec:first-child{margin-top:0}
  .grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
  @media(max-width:820px){.side{width:64px}.side .bd span,.nav button span,.side .me div{display:none}.grid2{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.card+.card{margin-top:14px}
  .clock{display:flex;flex-direction:column;align-items:center;padding:22px}
  .clock .t{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}.clock .d{color:var(--muted);font-size:13px;margin-top:2px}
  .punch{width:150px;height:150px;border-radius:50%;margin:18px 0 6px;border:8px solid var(--blue-soft);background:var(--blue);color:#fff;font-weight:800;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .punch.out{background:var(--red);border-color:var(--red-soft)}.punch small{font-weight:600;font-size:11px;opacity:.9;margin-top:4px}
  .statrow{display:flex;gap:10px;width:100%;margin-top:6px}.stat{flex:1;background:var(--bg);border-radius:11px;padding:10px;text-align:center}
  .stat .l{font-size:11px;color:var(--muted)}.stat .v{font-size:15px;font-weight:700;margin-top:2px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:none}
  .row .ttl{font-size:14px;font-weight:600}.row .meta{font-size:12px;color:var(--muted);margin-top:1px}
  .badge2{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .b-green{background:var(--green-soft);color:var(--green)}.b-amber{background:var(--amber-soft);color:var(--amber)}.b-red{background:var(--red-soft);color:var(--red)}.b-blue{background:var(--blue-soft);color:var(--blue)}
  .field{margin-top:12px}.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
  .field.two{display:flex;gap:10px}.field.two>div{flex:1}
  .seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;min-width:90px;padding:10px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--muted)}
  .seg button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
  .submit{width:100%;height:46px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;margin-top:16px;border:none}
  .act{display:flex;gap:8px}.act button{flex:1;height:38px;border-radius:10px;font-weight:700;font-size:13px;border:none}.ap{background:var(--green-soft);color:var(--green)}.rj{background:var(--red-soft);color:var(--red)}
  .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
  .metric .v{font-size:24px;font-weight:800}.metric .l{font-size:12px;color:var(--muted);margin-top:2px}
  .deptcard{background:var(--bg);border-radius:11px;padding:11px 12px;margin-bottom:10px}.deptcard:last-child{margin-bottom:0}
  .dh{font-size:13px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:4px}.dh span{font-size:11px;color:var(--blue);background:var(--blue-soft);padding:2px 8px;border-radius:20px}
  .mem{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}.mem:last-child{border-bottom:none}
  .mem b{font-weight:600}.mem .r{color:var(--muted);font-size:12px;margin-left:5px}.mem button{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:8px;background:#fff;color:var(--muted);border:1px solid var(--line)}
  .tditem{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}.tditem:last-child{border-bottom:none}.tditem.done span{text-decoration:line-through;color:var(--muted)}
  .tditem label{flex:1;display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}.tditem input{width:17px;height:17px}.xmini{color:var(--red);background:none;border:none;cursor:pointer;font-size:15px;font-weight:700}
  .todoadd{display:flex;gap:8px;margin-top:10px}.todoadd input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px}.todoadd button{width:40px;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;border:none}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:18px 0}
  .calwrap{border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .calhead{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg);border-bottom:1px solid var(--line)}.caldow{text-align:center;padding:8px 0;font-size:12px;font-weight:700;color:var(--muted)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr)}.calcell{min-height:84px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;cursor:pointer;overflow:hidden}.calcell:nth-child(7n){border-right:none}
  .calcell.out{background:var(--bg)}.calcell.sel{background:var(--blue-soft)}.calcell .dn{font-size:12px;font-weight:600}.calcell.today .dn{background:var(--blue);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}
  .evchip{font-size:10px;font-weight:600;padding:1px 4px;border-radius:4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:17px}
  .link{color:var(--blue);background:var(--blue-soft);border:none;border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:700}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:24px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .tdtag{font-size:11px;color:var(--muted);background:var(--bg);border-radius:8px;padding:2px 8px;font-weight:700;white-space:nowrap;display:inline-block}
  .modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:56px 16px;overflow:auto}
  .modalbox{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
</style>
</head>

async function afterLogin(user){
  const email=(user.email||'').toLowerCase();
  if(!email.endsWith('@homifactory.com')){
    await sb.auth.signOut();showLogin();
    $('lmsg').textContent='호미팩토리 계정(@homifactory.com)만 로그인할 수 있습니다.';return;

async function punch(){

function clockCard(a){
  const inT=a?fmtT(a.clock_in):'—', outT=a&&a.clock_out?fmtT(a.clock_out):'—';
  const state=!a?'punch':(a.clock_out?'punch out':'punch out');
  const label=!a?'출근하기':(a.clock_out?'완료':'퇴근하기');
  const dis=a&&a.clock_out;
  const d=new Date();const days=['일','월','화','수','목','금','토'];
  return `<div class="card clock"><div class="t">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</div>
    <div class="d">${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]}) · ${esc(me.name)} 님</div>
    <button class="${a&&a.clock_out?'punch out':'punch'}" ${dis?'disabled style=opacity:.6':''} onclick="punch()">${label}<small>${dis?'오늘 근무 종료':'클릭하여 기록'}</small></button>
    <div class="statrow"><div class="stat"><div class="l">출근</div><div class="v">${inT}</div></div><div class="stat"><div class="l">퇴근</div><div class="v">${outT}</div></div><div class="stat"><div class="l">상태</div><div class="v">${a?(a.clock_out?'완료':'근무중'):'대기'}</div></div></div></div>`;
}

/* ---------- 할 일 ---------- */
const WD=['일','월','화','수','목','금','토'];
function todayWeekday(){return new Date().getDay();}
async function fetchTodoState(){
  const {data:defs}=await sb.from('todos').select('*').eq('employee_id',me.id).order('created_at');
  const {data:comps}=await sb.from('todo_completions').select('todo_id').eq('employee_id',me.id).eq('done_date',todayStr());
  return {defs:defs||[],compSet:new Set((comps||[]).map(c=>c.todo_id))};
}
function applicableToday(t){
  if(t.recur_type==='daily')return true;
  if(t.recur_type==='weekly')return t.weekday===todayWeekday();
  return !t.done;
}
function todoChecked(t,compSet){return t.recur_type==='project'?!!t.done:compSet.has(t.id);}
function todoTag(t){return t.recur_type==='daily'?'데일리':t.recur_type==='weekly'?('매주 '+WD[t.weekday]+'요일'):'프로젝트';}
function sortByPrio(a){const r={'높음':0,'보통':1,'낮음':2};return a.slice().sort((x,y)=>(r[x.priority]??1)-(r[y.priority]??1));}
function prioPill(t){const p=t.priority||'보통';const m={'높음':'#D64545','보통':'#2E75B6','낮음':'#8A93A2'};return `<span class="tdtag" style="color:#fff;background:${m[p]||'#8A93A2'}">${p}</span>`;}
function fieldPill(t){return t.field?`<span class="tdtag" style="color:var(--navy);background:var(--blue-soft)">${esc(t.field)}</span>`:'';}
function todoRow2(t,compSet){const ck=todoChecked(t,compSet);
  return `<div class="tditem ${ck?'done':''}"><label><input type="checkbox" ${ck?'checked':''} onclick="toggleTodo2('${t.id}','${t.recur_type}',${ck})"><span>${esc(t.content)}</span></label>${prioPill(t)}${fieldPill(t)}<span class="tdtag">${todoTag(t)}</span><button class="xmini" onclick="delTodo('${t.id}')">×</button></div>`;}
async function toggleTodo2(id,rt,checked){
  if(rt==='project'){await sb.from('todos').update({done:!checked}).eq('id',id);}
  else if(checked){await sb.from('todo_completions').delete().eq('todo_id',id).eq('employee_id',me.id).eq('done_date',todayStr());}
  else{await sb.from('todo_completions').insert({todo_id:id,employee_id:me.id,done_date:todayStr()});}
  render();
}
async function viewTodo(){
  const ts=await fetchTodoState();
  const items=sortByPrio(ts.defs.filter(applicableToday));
  const list=items.map(t=>todoRow2(t,ts.compSet)).join('')||'<div class="empty">오늘 할 일이 없습니다</div>';
  const byId={};ts.defs.forEach(t=>byId[t.id]=t);
  const since=new Date(Date.now()-14*86400000).toISOString().slice(0,10);
  const {data:recent}=await sb.from('todo_completions').select('todo_id,done_date').eq('employee_id',me.id).gte('done_date',since).order('done_date',{ascending:false});
  const compRows=(recent||[]).filter(c=>byId[c.todo_id]).map(c=>`<div class="row"><div class="ttl" style="text-decoration:line-through;color:var(--muted)">${esc(byId[c.todo_id].content)} <span class="tdtag">${todoTag(byId[c.todo_id])}</span></div><div class="meta">${c.done_date}</div></div>`);
  const projRows=ts.defs.filter(t=>t.recur_type==='project'&&t.done).map(t=>`<div class="row"><div class="ttl" style="text-decoration:line-through;color:var(--muted)">${esc(t.content)} <span class="tdtag">프로젝트</span></div><button class="xmini" onclick="delTodo('${t.id}')">×</button></div>`);
  const doneList=[...projRows,...compRows].join('')||'<div class="empty">완료한 업무가 없습니다</div>';
  const wdOpts=WD.map((d,i)=>`<option value="${i}" ${i===todayWeekday()?'selected':''}>${d}요일</option>`).join('');
  let adminBlock='';
  if(me.is_admin){
    const {data:emps}=await sb.from('employees').select('id,name,dept').order('name');
    const {data:allTodos}=await sb.from('todos').select('*');
    const {data:allComps}=await sb.from('todo_completions').select('todo_id').eq('done_date',todayStr());
    const cset=new Set((allComps||[]).map(c=>c.todo_id));
    const byEmp={};(allTodos||[]).forEach(t=>{(byEmp[t.employee_id]=byEmp[t.employee_id]||[]).push(t);});
    const cards=(emps||[]).filter(e=>byEmp[e.id]&&byEmp[e.id].length).map(e=>{
      const its=sortByPrio((byEmp[e.id]||[]).filter(applicableToday));
      const doneN=its.filter(t=>todoChecked(t,cset)).length;
      const rows=its.length?its.map(t=>{const ck=todoChecked(t,cset);return `<div class="tditem ${ck?'done':''}"><span style="width:18px;text-align:center;color:${ck?'var(--green)':'var(--muted)'}">${ck?'✓':'▢'}</span><span style="flex:1">${esc(t.content)}</span>${prioPill(t)}${fieldPill(t)}<span class="tdtag">${todoTag(t)}</span></div>`;}).join(''):'<div class="empty" style="padding:6px 0">오늘 할 일 없음</div>';
      return `<div class="deptcard"><div class="dh">${esc(e.name)} · ${esc(e.dept||'-')}<span>${doneN}/${its.length}</span></div>${rows}</div>`;
    }).join('')||'<div class="empty">등록된 할 일이 없습니다</div>';
    adminBlock=`<h2 class="sec">전체 직원 할 일 현황 · 오늘</h2><div class="card">${cards}</div>`;

      <div class="field two"><div><label>분류</label><select id="td-type" onchange="document.getElementById('td-wdwrap').style.display=this.value==='weekly'?'':'none'"><option value="project">프로젝트(한 번)</option><option value="daily">데일리(매일)</option><option value="weekly">매주(요일 지정)</option></select></div><div id="td-wdwrap" style="display:none"><label>요일</label><select id="td-wd">${wdOpts}</select></div></div>
      <div class="field two"><div><label>우선순위</label><select id="td-prio"><option>보통</option><option>높음</option><option>낮음</option></select></div><div><label>분야</label><select id="td-field"><option value="">미지정</option><option>틱톡</option><option>그룹라이브</option><option>마케팅</option><option>매니지먼트</option></select></div></div>
      <button class="submit" onclick="addTodo()">추가</button>
    </div></div>
    <div><h2 class="sec">완료한 업무 (최근 2주)</h2><div class="card">${doneList}</div></div></div>${adminBlock}`;
}
async function addTodo(){
  const el=$('td-in');const v=el.value.trim();if(!v)return;
  const rt=$('td-type')?$('td-type').value:'project';
  const wd=(rt==='weekly'&&$('td-wd'))?parseInt($('td-wd').value):null;
  const prio=$('td-prio')?$('td-prio').value:'보통';

  el.value='';
  await sb.from('todos').insert({employee_id:me.id,content:v,recur_type:rt,weekday:wd,priority:prio,field:field||null});
  render();
}

  const cats=['TIKTOK','BENEFIT','마케팅','공연','매니지먼트','업무','기타'];
  const catOpts=cats.map(c=>`<option>${c}</option>`).join('');
  const arows=(arc||[]).map(a=>`<div class="row"><div style="flex:1"><div class="ttl">${a.category?`<span class="tdtag">${esc(a.category)}</span> `:''}<span style="color:#E8A300">${arStars(a.impact)}</span> ${a.url?`<a href="${esc(a.url)}" target="_blank" style="color:var(--blue)">${esc(a.title)}</a>`:esc(a.title)}${a.file_path?` <button class="xmini" style="color:var(--blue)" onclick="openArchiveFile('${a.file_path}')">📎 ${esc(a.file_name||'파일')}</button>`:''}</div>${a.note?`<div class="meta">${esc(a.note)}</div>`:''}</div><div style="display:flex;align-items:center;gap:8px"><span class="meta">${(a.created_at||'').slice(0,10)}</span><button class="xmini" onclick="delArchive('${a.id}')">×</button></div></div>`).join('')||'<div class="empty">등록된 자료가 없습니다</div>';
  const modal=arcModal?`<div class="modalbg" onclick="if(event.target===this){arcModal=false;render()}"><div class="modalbox">
    <div style="font-weight:700;font-size:16px;margin-bottom:6px">자료 · 메뉴얼 추가</div>
    <div class="field"><label>제목</label><input id="ar-title" placeholder="제목"></div>
    <div class="field two"><div><label>분야</label><select id="ar-cat">${catOpts}</select></div><div><label>임팩트</label><select id="ar-impact"><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select></div></div>
    <div class="field"><label>링크</label><input id="ar-url" placeholder="https://"></div>
    <div class="field"><label>파일 첨부 (PPT·PDF·Excel 등)</label><input type="file" id="ar-file" accept=".ppt,.pptx,.pdf,.xls,.xlsx,.doc,.docx,.csv,image/*"></div>
    <div class="field"><label>코멘트</label><textarea id="ar-note" rows="2"></textarea></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button onclick="arcModal=false;render()" style="background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer">취소</button><button class="ap" onclick="addArchive()">저장</button></div>
  </div></div>`:'';
  return `<div style="max-width:760px;margin:0 auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h2 class="sec" style="margin:0">자료 · 메뉴얼 (${(arc||[]).length})</h2>
      <button onclick="arcModal=true;render()" style="background:var(--blue);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer">+ 추가</button>
    </div>
    <div class="card">${arows}</div>
  </div>${modal}`;
}
async function addArchive(){
  const t=$('ar-title').value.trim();if(!t){toast('제목을 입력하세요');return;}
  let file_path=null,file_name=null;
  const fi=$('ar-file');
  if(fi&&fi.files&&fi.files[0]){const f=fi.files[0];const ext=(f.name.split('.').pop()||'dat').toLowerCase();file_path=`${me.id}/${Date.now()}.${ext}`;file_name=f.name;const up=await sb.storage.from('archive-files').upload(file_path,f,{contentType:f.type});if(up.error){toast('파일 업로드 실패: '+up.error.message);return;}}
  const {error}=await sb.from('archives').insert({title:t,category:$('ar-cat').value,impact:Number($('ar-impact').value||3),url:$('ar-url').value,note:$('ar-note').value,file_path,file_name,created_by:me.id});
  if(error){toast('오류: '+error.message);return;}
  arcModal=false;toast('자료가 추가되었습니다');render();
}
async function openArchiveFile(path){const {data,error}=await sb.storage.from('archive-files').createSignedUrl(path,180);if(error||!data){toast('파일을 열 수 없습니다');return;}window.open(data.signedUrl,'_blank');}
async function delArchive(id){await sb.from('archives').delete().eq('id',id);render();}

/* ---------- 마이페이지 ---------- */
async function viewMyPage(){
  const {data:{user}}=await sb.auth.getUser();
  return `<h2 class="sec">내 정보</h2><div class="card" style="max-width:520px">
    <div class="row"><div class="meta">이름</div><div class="ttl">${esc(me.name||'')}</div></div>
    <div class="row"><div class="meta">이메일</div><div class="ttl">${esc(user?user.email:'')}</div></div>
    <div class="row"><div class="meta">부서 · 직급</div><div class="ttl">${esc(me.dept||'')} ${esc(me.role||'')}${me.is_admin?' · 관리자':''}</div></div>
  </div>
  <h2 class="sec">비밀번호 변경</h2><div class="card" style="max-width:520px">
    <div class="field"><label>새 비밀번호</label><input type="password" id="np1" placeholder="새 비밀번호 (8자 이상 권장)"></div>
    <div class="field"><label>새 비밀번호 확인</label><input type="password" id="np2" placeholder="다시 입력"></div>
    <button class="submit" onclick="changePw()">비밀번호 변경</button>
    <div class="meta" id="pwmsg" style="margin-top:10px"></div>
  </div>`;
}
async function changePw(){
  const a=$('np1').value,b=$('np2').value,m=$('pwmsg');m.style.color='var(--muted)';m.textContent='';
  if(!a||a.length<6){m.style.color='var(--red)';m.textContent='6자 이상 입력하세요';return;}
  if(a!==b){m.style.color='var(--red)';m.textContent='두 비밀번호가 일치하지 않습니다';return;}
  const {error}=await sb.auth.updateUser({password:a});
  if(error){m.style.color='var(--red)';m.textContent='오류: '+error.message;return;}
  m.style.color='var(--green)';m.textContent='✓ 비밀번호가 변경되었습니다';$('np1').value='';$('np2').value='';
}

/* ---------- 로그인 ---------- */
async function doLogin(){
  const email=$('email').value.trim(),pw=$('pw').value;const m=$('lmsg');m.textContent='';
  if(!email||!pw){m.textContent='이메일과 비밀번호를 입력하세요';return;}
  $('loginBtn').disabled=true;$('loginBtn').textContent='로그인 중…';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  $('loginBtn').disabled=false;$('loginBtn').textContent='로그인';
  if(error){m.textContent='로그인 실패: '+error.message;return;}
  afterLogin(data.user);
}
$('loginBtn').onclick=doLogin;
$('googleBtn').onclick=async()=>{
  const m=$('lmsg');m.textContent='';
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin,queryParams:{hd:'homifactory.com',prompt:'select_account'}}});
  if(error){m.textContent='구글 로그인 실패: '+error.message;}
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('logout').onclick=async()=>{await sb.auth.signOut();showLogin();};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='td-in')addTodo();});
sb.auth.getSession().then(({data})=>{if(data.session)afterLogin(data.session.user);});
</script>
</body>
</html>
