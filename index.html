<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>호미팩토리 ERP</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2740">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="호미 ERP">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --navy:#1B2740;--navy2:#172036;--blue:#2F6BE4;--blue-strong:#2057C9;--blue-soft:#EAF1FE;
    --ink:#151C2D;--muted:#6B7587;--line:#ECEEF3;--bg:#F5F7FB;--card:#FFFFFF;
    --green:#16A06B;--green-soft:#E4F6EE;--amber:#C2890F;--amber-soft:#FBF0DA;--red:#E0484B;--red-soft:#FCEBEB;
    --radius:18px;--radius-sm:12px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 22px -10px rgba(16,24,40,.12);
    --shadow-lg:0 24px 60px -14px rgba(16,24,40,.30)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","맑은 고딕",sans-serif;background:var(--bg);color:var(--ink);word-break:keep-all;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font-family:inherit;cursor:pointer}
  a,button,input,select,textarea,.card,.nav button,.seg button,.metric,.navbtn,.mem button{transition:background-color .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease,transform .15s ease}
  .hidden{display:none!important}
  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 50% -10%,#1d2b4d 0%,#0B0F18 60%)}
  #login .box{width:392px;max-width:92vw;padding:34px 32px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:22px;backdrop-filter:blur(8px);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
  #login .brand{display:flex;justify-content:center;margin-bottom:22px}#login .brand img{width:220px;max-width:84%}
  #login h1{color:#fff;font-size:21px;margin:0 0 4px;text-align:center;font-weight:600;letter-spacing:-.02em}
  #login p.sub{color:#9AA3B0;margin:0 0 18px;font-size:13.5px;text-align:center}
  #login label{display:block;font-size:12.5px;color:#AEB3BB;margin:12px 0 5px;font-weight:600}
  #login input{width:100%;height:48px;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:0 14px;font-size:15px;outline:none;background:rgba(255,255,255,.06);color:#fff}
  #login input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,107,228,.25)}
  #login .btn{width:100%;height:50px;border-radius:12px;background:linear-gradient(180deg,#3B78EE,#2057C9);color:#fff;font-weight:700;font-size:15px;margin-top:20px;border:none;box-shadow:0 10px 22px -10px rgba(47,107,228,.8)}
  #login .btn:hover{filter:brightness(1.06)}
  #login .msg{margin-top:12px;font-size:13px;text-align:center;color:#F09595;min-height:16px}
  /* shell */
  #app{display:flex;height:100vh}
  .side{width:222px;flex:none;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;display:flex;flex-direction:column;padding:18px 14px;overflow:auto}
  .side .bd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:4px 6px 16px;letter-spacing:-.01em}.side .bd img{height:22px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border-radius:12px;color:#AFC0DC;font-size:14px;font-weight:600;text-align:left;background:none;border:none;margin-bottom:2px}
  .nav button:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav button.on{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  .nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:9px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
  .side .me{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;display:flex;align-items:center;gap:9px}
  .side .me .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#fff,#E9EFFB);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .side .me small{display:block;color:#9DB3D2;font-size:11px}
  .side .me .lo{margin-left:auto;color:#9DB3D2;font-size:12px;background:none;border:none}
  .side .me .lo:hover{color:#fff}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.02em}.top .date{color:var(--muted);font-size:13px;font-weight:500}
  .scroll{flex:1;overflow:auto;padding:24px 28px 56px}.wrap{max-width:1040px;margin:0 auto}
  h2.sec{font-size:12.5px;color:var(--muted);font-weight:700;margin:22px 2px 11px;text-transform:none;letter-spacing:.01em}h2.sec:first-child{margin-top:0}
  .grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
  .hamb{display:none;background:none;border:none;font-size:22px;color:var(--ink);cursor:pointer;padding:0 2px;line-height:1}
  .sideov{display:none}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  @media(max-width:760px){
    .hamb{display:inline-flex}
    #app{display:block;height:auto}
    .side{position:fixed;top:0;left:0;bottom:0;width:236px;z-index:60;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.35)}
    .side.open{transform:translateX(0)}
    .main{min-height:100vh}
    .sideov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
    .sideov.show{display:block}
    .top{padding:12px 16px;position:sticky;top:0;z-index:40}
    .top h1{font-size:17px}
    .scroll{padding:16px 14px 64px;height:auto;overflow:visible}
    .wrap{max-width:100%}
    .card{padding:14px;border-radius:14px}
    .clock{padding:18px}.clock .t{font-size:36px}
    .punch{width:132px;height:132px;font-size:18px}
    .calcell{min-height:58px;padding:3px 4px}.calcell .dn{font-size:11px}.evchip{font-size:9px;padding:1px 3px}
    .caldow{font-size:11px;padding:6px 0}
    .modalbox{padding:18px}
    .mgrid{grid-template-columns:repeat(3,1fr)}
  }
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.card+.card{margin-top:14px}
  .clock{display:flex;flex-direction:column;align-items:center;padding:24px}
  .clock .t{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}.clock .d{color:var(--muted);font-size:13px;margin-top:2px}
  .punch{width:154px;height:154px;border-radius:50%;margin:20px 0 8px;border:none;background:radial-gradient(120% 120% at 30% 25%,#4a86f2 0%,var(--blue) 45%,var(--blue-strong) 100%);color:#fff;font-weight:800;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 16px 34px -12px rgba(47,107,228,.75),inset 0 0 0 8px rgba(255,255,255,.12)}
  .punch:hover{transform:translateY(-2px)}.punch:active{transform:translateY(0)}
  .punch.out{background:radial-gradient(120% 120% at 30% 25%,#f06d6f 0%,var(--red) 50%,#c23b3e 100%);box-shadow:0 16px 34px -12px rgba(224,72,75,.7),inset 0 0 0 8px rgba(255,255,255,.12)}.punch small{font-weight:600;font-size:11px;opacity:.9;margin-top:4px}
  .statrow{display:flex;gap:10px;width:100%;margin-top:8px}.stat{flex:1;background:var(--bg);border-radius:12px;padding:11px;text-align:center}
  .stat .l{font-size:11px;color:var(--muted)}.stat .v{font-size:15px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:none}
  .row .ttl{font-size:14px;font-weight:600}.row .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .badge2{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap}
  .b-green{background:var(--green-soft);color:var(--green)}.b-amber{background:var(--amber-soft);color:var(--amber)}.b-red{background:var(--red-soft);color:var(--red)}.b-blue{background:var(--blue-soft);color:var(--blue)}
  .field{margin-top:13px}.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,107,228,.13)}
  .field.two{display:flex;gap:10px}.field.two>div{flex:1}
  .seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;min-width:90px;padding:11px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--muted)}
  .seg button:hover{border-color:#D6DCE8}.seg button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
  .submit{width:100%;height:48px;border-radius:13px;background:linear-gradient(180deg,#3B78EE,var(--blue-strong));color:#fff;font-weight:700;font-size:15px;margin-top:16px;border:none;box-shadow:0 12px 24px -12px rgba(47,107,228,.8)}
  .submit:hover{filter:brightness(1.05)}.submit:active{transform:translateY(1px)}
  .act{display:flex;gap:8px}.act button{flex:1;height:40px;border-radius:11px;font-weight:700;font-size:13px;border:none}.ap{background:var(--green-soft);color:var(--green)}.ap:hover{background:#d6f0e4}.rj{background:var(--red-soft);color:var(--red)}.rj:hover{background:#f8dede}
  .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;text-align:center;box-shadow:var(--shadow)}
  .metric .v{font-size:26px;font-weight:800;letter-spacing:-.02em}.metric .l{font-size:12px;color:var(--muted);margin-top:2px}
  .deptcard{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:10px}.deptcard:last-child{margin-bottom:0}
  .dh{font-size:13px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:5px}.dh span{font-size:11px;color:var(--blue);background:var(--blue-soft);padding:2px 9px;border-radius:20px}
  .mem{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}.mem:last-child{border-bottom:none}
  .mem b{font-weight:600}.mem .r{color:var(--muted);font-size:12px;margin-left:5px}.mem button{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:9px;background:#fff;color:var(--muted);border:1px solid var(--line)}.mem button:hover{border-color:var(--blue);color:var(--blue)}
  .tditem{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.tditem:last-child{border-bottom:none}.tditem.done span{text-decoration:line-through;color:var(--muted)}
  .tditem label{flex:1;display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}.tditem input{width:18px;height:18px;accent-color:var(--blue)}.xmini{color:var(--red);background:none;border:none;cursor:pointer;font-size:15px;font-weight:700}
  .todoadd{display:flex;gap:8px;margin-top:11px}.todoadd input{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13px;outline:none}.todoadd input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,107,228,.13)}.todoadd button{width:42px;border-radius:11px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;border:none}.todoadd button:hover{background:var(--blue-strong)}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:20px 0}
  .fldgrp{margin-bottom:4px}.fldgrp:last-child{margin-bottom:0}
  .fldhd{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink);margin:16px 2px 3px}
  .card .fldgrp:first-child .fldhd{margin-top:2px}
  .fldhd .cnt{font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border-radius:10px;padding:1px 8px}
  .calwrap{border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow);background:#fff}
  .calhead{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg);border-bottom:1px solid var(--line)}.caldow{text-align:center;padding:9px 0;font-size:12px;font-weight:700;color:var(--muted)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr)}.calcell{min-height:86px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 7px;cursor:pointer;overflow:hidden}.calcell:nth-child(7n){border-right:none}
  .calcell:hover{background:#FAFBFE}.calcell.out{background:var(--bg)}.calcell.sel{background:var(--blue-soft)}.calcell .dn{font-size:12px;font-weight:600}.calcell.today .dn{background:var(--blue);color:#fff;border-radius:50%;width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center}
  .evchip{font-size:10px;font-weight:600;padding:2px 5px;border-radius:6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:17px;color:var(--ink)}.navbtn:hover{border-color:var(--blue);color:var(--blue)}
  .link{color:var(--blue);background:var(--blue-soft);border:none;border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:700}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:24px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 14px 34px -10px rgba(0,0,0,.5)}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .tdtag{font-size:11px;color:var(--muted);background:var(--bg);border-radius:8px;padding:3px 9px;font-weight:700;white-space:nowrap;display:inline-block}
  .modalbg{position:fixed;inset:0;background:rgba(16,22,40,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:56px 16px;overflow:auto}
  .modalbox{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:520px;box-shadow:var(--shadow-lg)}
</style>
</head>

window.pomo=window.pomo||{phase:'work',left:25*60,running:false,work:25,brk:5,done:0,focus1:null,focus2:null};
function pomoFmt(s){s=Math.max(0,s|0);const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}
function pomoBeep(){try{const ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.resume)ac.resume();const beep=(t,f)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.3,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);o.start(t);o.stop(t+0.36);};const n=ac.currentTime;beep(n,880);beep(n+0.45,880);beep(n+0.9,1175);setTimeout(()=>ac.close(),1700);}catch(e){}}
function pomoCard(todos){const p=window.pomo;const fopt=(sel)=>`<option value="">— 없음 —</option>`+(todos||[]).map(t=>`<option value="${t.id}" ${sel===t.id?'selected':''}>${esc(t.content)}</option>`).join('');const C=2*Math.PI*52;const total=(p.phase==='work'?p.work:p.brk)*60;const off=C*(1-(total?p.left/total:0));const col=p.phase==='work'?'#2E75B6':'#1E9E6A';const setv=p.work+'/'+p.brk;
  const opt=(w,b,l)=>`<option value="${w}/${b}" ${setv===w+'/'+b?'selected':''}>${l}</option>`;
  return `<div class="card" id="pomo-card" style="text-align:center;border:1px solid ${col}33;height:100%;display:flex;flex-direction:column;justify-content:center">
    <div style="font-weight:700;font-size:13px;color:var(--muted);margin-bottom:8px">뽀모도로 · <span id="pomo-phase" style="color:${col}">${p.phase==='work'?'집중':'휴식'}</span></div>
    <div style="position:relative;width:148px;height:148px;margin:0 auto">
      <svg width="148" height="148" viewBox="0 0 120 120" style="transform:rotate(-90deg)"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="9"></circle><circle id="pomo-ring" cx="60" cy="60" r="52" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"></circle></svg>
      <div id="pomo-time" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;letter-spacing:1px">${pomoFmt(p.left)}</div>
    </div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:14px">
      <button id="pomo-toggle" onclick="pomoToggle()" class="submit" style="width:auto;padding:9px 26px;margin:0">${p.running?'일시정지':'시작'}</button>
      <button onclick="pomoSkip()" style="background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer">건너뛰기</button>
      <button onclick="pomoReset()" style="background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer">리셋</button>
    </div>
    <div style="margin-top:12px;font-size:12px;color:var(--muted)">오늘 완료 <b id="pomo-count" style="color:var(--ink)">${p.done}</b>회 · <select onchange="var v=this.value.split('/');pomoSet(+v[0],+v[1])" style="border:1px solid var(--line);border-radius:7px;padding:3px 6px;font-size:12px;font-family:inherit">${opt(25,5,'25 / 5분')}${opt(50,10,'50 / 10분')}${opt(15,3,'15 / 3분')}</select></div>
    <div style="margin-top:14px;text-align:left">
      <div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px">🎯 집중 업무 (내 할 일에서 선택)</div>
      <div style="display:flex;gap:8px">
        <div style="flex:1"><div style="font-size:11px;color:var(--muted);margin-bottom:3px">1순위</div><select onchange="pomoSetFocus(1,this.value)" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)">${fopt(p.focus1)}</select></div>
        <div style="flex:1"><div style="font-size:11px;color:var(--muted);margin-bottom:3px">2순위</div><select onchange="pomoSetFocus(2,this.value)" style="width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)">${fopt(p.focus2)}</select></div>
      </div>
    </div>
  </div>`;}
function pomoSync(){const p=window.pomo;const el=document.getElementById('pomo-time');if(!el)return;el.textContent=pomoFmt(p.left);const col=p.phase==='work'?'#2E75B6':'#1E9E6A';const ph=document.getElementById('pomo-phase');if(ph){ph.textContent=p.phase==='work'?'집중':'휴식';ph.style.color=col;}const C=2*Math.PI*52,total=(p.phase==='work'?p.work:p.brk)*60,ring=document.getElementById('pomo-ring');if(ring){ring.style.strokeDashoffset=C*(1-(total?p.left/total:0));ring.style.stroke=col;}const b=document.getElementById('pomo-toggle');if(b)b.textContent=p.running?'일시정지':'시작';const c=document.getElementById('pomo-count');if(c)c.textContent=p.done;const card=document.getElementById('pomo-card');if(card)card.style.borderColor=col+'33';}
function pomoArm(){window.pomo.endAt=Date.now()+window.pomo.left*1000;}
function pomoTick(){const p=window.pomo;if(!p.running)return;const rem=Math.round((p.endAt-Date.now())/1000);p.left=rem>0?rem:0;if(rem<=0){if(p.phase==='work'){p.done++;p.phase='break';p.left=p.brk*60;toast('집중 완료! 휴식하세요 ☕');}else{p.phase='work';p.left=p.work*60;toast('휴식 끝! 다시 집중 💪');}p.endAt=Date.now()+p.left*1000;pomoBeep();}pomoSync();}
function pomoToggle(){const p=window.pomo;p.running=!p.running;if(p.running){if(p.left<=0)p.left=(p.phase==='work'?p.work:p.brk)*60;pomoArm();}pomoSync();}
function pomoSkip(){const p=window.pomo;if(p.phase==='work'){p.phase='break';p.left=p.brk*60;}else{p.phase='work';p.left=p.work*60;}if(p.running)pomoArm();pomoSync();}
function pomoReset(){const p=window.pomo;p.running=false;p.phase='work';p.left=p.work*60;pomoSync();}
function pomoSet(w,b){const p=window.pomo;p.work=w;p.brk=b;p.left=(p.phase==='work'?w:b)*60;if(p.running)pomoArm();pomoSync();}
function pomoSetFocus(n,id){window.pomo['focus'+n]=id||null;}
function clockTick(){const el=document.getElementById('home-clock');if(!el)return;const d=new Date();el.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

  if(docType==='야근·주말·외근') return `<div class="field"><label>근무 구분</label><select id="dc-kind" onchange="var v=this.value;document.getElementById('dc-compwrap').style.display=(v==='주말 근무'||v==='공휴일 근무')?'':'none';"><option>평일 야근</option><option>주말 근무</option><option>공휴일 근무</option><option>외근</option></select></div>
    <div class="field"><label>일자</label><input type="date" id="dc-date" value="${todayStr()}"></div>
    <div class="field two"><div><label>시작</label><input type="time" id="dc-s" value="18:00"></div><div><label>종료</label><input type="time" id="dc-e" value="21:00"></div></div>
    <div class="field" id="dc-compwrap" style="display:none"><label>대체 휴일 (다음 주) · 주말·공휴일 근무 시 함께 신청</label><input type="date" id="dc-comp" value="${plusDays(todayStr(),7)}"></div>
    <div class="field"><label>행선지 (외근 시)</label><input id="dc-place" placeholder="외근 장소 / 행선지"></div>
    <div class="field"><label>사유</label><textarea id="dc-reason" rows="2"></textarea></div>`;
  if(docType==='구매 상신') return `<div class="field"><label>품목명</label><input id="dc-item" placeholder="구매 품목"></div>
    <div class="field two"><div><label>수량</label><input type="number" id="dc-qty" value="1"></div><div><label>예상 금액(원)</label><input type="number" id="dc-amt" placeholder="0"></div></div>
    <div class="field"><label>구매처 (희망)</label><input id="dc-vendor" placeholder="판매처 / 링크"></div>
    <div class="field"><label>결제 수단</label><select id="dc-card"><option>법인카드</option><option>개인카드</option><option>계좌이체</option><option>미정</option></select></div>
    <div class="field"><label>사유</label><textarea id="dc-reason" rows="2"></textarea></div>`;
  return `<div class="field"><label>지출 항목</label><select id="dc-cat"><option>식대</option><option>교통비</option><option>장비 구입</option><option>광고비</option><option>기타</option></select></div>
    <div class="field"><label>카드 구분</label><select id="dc-card"><option>법인카드</option><option>개인카드</option></select></div>
    <div class="field two"><div><label>지출일</label><input type="date" id="dc-date" value="${todayStr()}"></div><div><label>금액(원)</label><input type="number" id="dc-amt" placeholder="0"></div></div>
    <div class="field"><label>사용처</label><input id="dc-vendor" placeholder="상호"></div>
    <div class="field"><label>내역</label><textarea id="dc-reason" rows="2"></textarea></div>
    <div class="field"><label>영수증 첨부 (이미지/PDF)</label><input type="file" id="dc-receipt" accept="image/*,.pdf"></div>`;
}
function docDetailRows(d){
  const p=d.payload||{};
  const f=(l,v)=>(v!==undefined&&v!==null&&v!=='')?`<div style="margin-top:10px"><div class="meta" style="font-weight:700;color:var(--ink)">${l}</div><div style="white-space:pre-wrap;margin-top:2px">${esc(String(v))}</div></div>`:'';
  if(d.doc_type==='야근·주말·외근') return f('근무 구분',p.kind)+f('일자',p.date)+f('시간',(p.start||'')+' ~ '+(p.end||''))+f('행선지',p.place)+f('대체 휴일',p.comp)+f('사유',p.reason);
  if(d.doc_type==='구매 상신') return f('품목명',p.item)+f('수량',p.qty)+f('예상 금액',p.amount?Number(p.amount).toLocaleString()+'원':'')+f('구매처',p.vendor)+f('결제 수단',p.card)+f('사유',p.reason);
  return f('지출 항목',p.cat)+f('카드 구분',p.card)+f('지출일',p.date)+f('금액',p.amount?Number(p.amount).toLocaleString()+'원':'')+f('사용처',p.vendor)+f('내역',p.reason);
}

async function submitDoc(){
  let summary='', payload={}, receipt_path=null;
  if(docType==='야근·주말·외근'){const k=$('dc-kind').value,d=$('dc-date').value,st=$('dc-s').value,e=$('dc-e').value,place=$('dc-place')?$('dc-place').value:'';const comp=((k==='주말 근무'||k==='공휴일 근무')&&$('dc-comp'))?$('dc-comp').value:'';summary=`${k} ${d} ${st}~${e}${place?' · '+place:''}${comp?' · 대체휴일 '+comp:''}`;payload={kind:k,date:d,start:st,end:e,place,comp,reason:$('dc-reason').value};}
  else if(docType==='구매 상신'){const item=$('dc-item').value,qty=Number($('dc-qty').value||1),amt=Number($('dc-amt').value||0),v=$('dc-vendor').value,card=$('dc-card').value;summary=`${item} ${qty}개 · ${amt.toLocaleString()}원 [${card}]`;payload={item,qty,amount:amt,vendor:v,card,reason:$('dc-reason').value};}
  else{const c=$('dc-cat').value,card=$('dc-card').value,d=$('dc-date').value,amt=Number($('dc-amt').value||0),v=$('dc-vendor').value;summary=`[${card}] ${c} ${amt.toLocaleString()}원 · ${v||'-'}`;payload={cat:c,card,date:d,amount:amt,vendor:v,reason:$('dc-reason').value};
    const fi=$('dc-receipt');
    if(fi&&fi.files&&fi.files[0]){const f=fi.files[0];const ext=(f.name.split('.').pop()||'dat').toLowerCase();const path=`${me.id}/${Date.now()}.${ext}`;const up=await sb.storage.from('receipts').upload(path,f,{contentType:f.type});if(up.error){toast('영수증 업로드 실패: '+up.error.message);return;}receipt_path=path;}
  }
  const {error}=await sb.from('documents').insert({employee_id:me.id,doc_type:docType,summary,payload,card_type:payload.card||null,receipt_path,status:'대기'});
  if(error){toast('오류: '+error.message);return;}
  if(docType==='야근·주말·외근'&&payload.comp){
    const {data:lr}=await sb.from('leave_requests').insert({employee_id:me.id,leave_type:'대체휴일',start_date:payload.comp,end_date:payload.comp,reason:(payload.kind||'')+' 대체 휴일',status:'대기'}).select('id').maybeSingle();
    if(lr){await sb.from('events').insert({title:me.name+' 대체휴일',event_date:payload.comp,event_type:'휴가대기',employee_id:me.id,created_by:me.id,leave_id:lr.id});}
    toast('결재 상신 · 대체 휴일도 함께 신청되었습니다');render();return;
  }
  toast('결재가 상신되었습니다');render();
}
async function openReceipt(path){const {data,error}=await sb.storage.from('receipts').createSignedUrl(path,180);if(error||!data){toast('영수증을 열 수 없습니다');return;}window.open(data.signedUrl,'_blank');}
async function decideDoc(id,ok){
  const {data:doc}=await sb.from('documents').select('doc_type,summary').eq('id',id).maybeSingle();
  await sb.from('documents').update({status:ok?'승인':'반려'}).eq('id',id);
  if(ok&&doc&&doc.doc_type==='구매 상신'){
    const {data:pj}=await sb.from('employees').select('id').eq('name','박영주').maybeSingle();
    if(pj){await sb.from('todos').insert({employee_id:pj.id,content:'[구매 요청] '+(doc.summary||''),recur_type:'project',priority:'높음'});}

  }else{toast(ok?'승인 완료':'반려 완료');}
  await refreshBadges();render();
}

let evEdit=null;
function startEvEdit(id){evEdit=id;render();}
async function saveEvEdit(){const t=$('ev-title').value.trim();if(!t){toast('제목을 입력하세요');return;}const s=$('ev-date').value;const en=$('ev-end')?$('ev-end').value:'';const pd=[...document.querySelectorAll('.ev-pdept:checked')].map(c=>c.value);const pp=[...document.querySelectorAll('.ev-pperson:checked')].map(c=>c.value);const {error}=await sb.from('events').update({title:t,event_date:s,end_date:(en&&en>s)?en:null,event_type:$('ev-type').value,event_time:$('ev-time')?$('ev-time').value:null,part_depts:pd.length?pd:null,part_people:pp.length?pp:null}).eq('id',evEdit);if(error){toast('수정 실패: '+error.message);return;}evEdit=null;toast('일정이 수정되었습니다');render();}
const GCAL='https://www.googleapis.com/calendar/v3/calendars/primary/events';
window.gToken=window.gToken||null;
function gcalHeaders(){return {'Authorization':'Bearer '+window.gToken,'Content-Type':'application/json'};}
function gcalRelogin(){sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin,scopes:'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/gmail.labels',queryParams:{hd:'homifactory.com',prompt:'consent',access_type:'offline'}}});}
function evToGcalBody(e){
  if(e.event_time){const t=(e.event_time.length===5?e.event_time:e.event_time.slice(0,5));
    const sd=new Date(e.event_date+'T'+t+':00');const ed=new Date(sd.getTime()+3600000);
    const pad=n=>String(n).padStart(2,'0');
    const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':00';
    return {summary:e.title,start:{dateTime:fmt(sd),timeZone:'Asia/Seoul'},end:{dateTime:fmt(ed),timeZone:'Asia/Seoul'}};}
  return {summary:e.title,start:{date:e.event_date},end:{date:plusDays(e.end_date||e.event_date,1)}};
}
async function gcalSync(){
  if(!window.gToken){if(confirm('구글 캘린더 연동을 위해 구글 계정으로 다시 로그인(권한 동의)이 필요합니다. 지금 진행할까요?'))gcalRelogin();return;}
  const btn=document.getElementById('gcal-btn');if(btn){btn.disabled=true;btn.textContent='동기화 중…';}
  try{
    const mfrom=`${calY}-${String(calM+1).padStart(2,'0')}-01`;
    const lastDay=new Date(calY,calM+1,0).getDate();
    const mto=`${calY}-${String(calM+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
    const {data:evs}=await sb.from('events').select('*').gte('event_date',mfrom).lte('event_date',mto);
    const {data:links}=await sb.from('gcal_links').select('event_id,gcal_id').eq('employee_id',me.id);
    const linkMap={};(links||[]).forEach(l=>linkMap[l.event_id]=l.gcal_id);
    let pushed=0,updated=0;
    for(const e of (evs||[])){
      const body=evToGcalBody(e);body.extendedProperties={private:{erpId:String(e.id)}};
      if(linkMap[e.id]){await fetch(GCAL+'/'+encodeURIComponent(linkMap[e.id]),{method:'PATCH',headers:gcalHeaders(),body:JSON.stringify(body)});updated++;}
      else{const r=await fetch(GCAL,{method:'POST',headers:gcalHeaders(),body:JSON.stringify(body)});if(r.status===401)throw{c401:true};const j=await r.json();if(j.id){await sb.from('gcal_links').upsert({event_id:e.id,employee_id:me.id,gcal_id:j.id},{onConflict:'event_id,employee_id'});linkMap[e.id]=j.id;pushed++;}}
    }
    const timeMin=new Date(calY,calM,1).toISOString();
    const timeMax=new Date(calY,calM+1,1).toISOString();
    const url=GCAL+'?singleEvents=true&orderBy=startTime&maxResults=250&timeMin='+encodeURIComponent(timeMin)+'&timeMax='+encodeURIComponent(timeMax);
    const r2=await fetch(url,{headers:gcalHeaders()});if(r2.status===401)throw{c401:true};
    const data=await r2.json();const items=data.items||[];
    const mine=new Set(Object.values(linkMap));
    await sb.from('gcal_events').delete().eq('employee_id',me.id).gte('event_date',mfrom).lte('event_date',mto);
    const rows=[];let pulled=0;
    for(const it of items){
      if(mine.has(it.id))continue;
      if(it.extendedProperties&&it.extendedProperties.private&&it.extendedProperties.private.erpId)continue;
      if(it.status==='cancelled')continue;
      const sdate=it.start&&(it.start.date||((it.start.dateTime||'').slice(0,10)));
      if(!sdate||sdate<mfrom||sdate>mto)continue;
      const stime=(it.start&&it.start.dateTime)?it.start.dateTime.slice(11,16):null;
      rows.push({employee_id:me.id,gcal_id:it.id,title:it.summary||'(제목 없음)',event_date:sdate,event_time:stime});pulled++;
    }
    if(rows.length)await sb.from('gcal_events').upsert(rows,{onConflict:'employee_id,gcal_id'});
    window._gcalLast=new Date();
    toast(`구글 캘린더 동기화 완료 · 내보냄 ${pushed} · 갱신 ${updated} · 가져옴 ${pulled}`);
    render();
  }catch(err){
    if(err&&err.c401){if(confirm('구글 접근 토큰이 만료되었습니다. 다시 로그인(동의)할까요?'))gcalRelogin();}
    else toast('동기화 오류: '+((err&&err.message)||err));
    const b=document.getElementById('gcal-btn');if(b){b.disabled=false;b.textContent='🔄 구글 캘린더 동기화';}
    return;
  }
  const b=document.getElementById('gcal-btn');if(b){b.disabled=false;b.textContent='🔄 구글 캘린더 동기화';}
}
async function calendarBlock(){
  const mfrom=`${calY}-${String(calM+1).padStart(2,'0')}-01`;
  const lastDay=new Date(calY,calM+1,0).getDate();
  const mtoStr=`${calY}-${String(calM+1).padStart(2,'0')}-${lastDay}`;
  const {data:emps}=await sb.from('emp_dir').select('id,name').order('name');
  const nameById={};(emps||[]).forEach(e=>nameById[e.id]=e.name);
  const {data:evs}=await sb.from('events').select('*').gte('event_date',mfrom).lte('event_date',mtoStr);
  let gevs=[];try{const r=await sb.from('gcal_events').select('*').gte('event_date',mfrom).lte('event_date',mtoStr);gevs=r.data||[];}catch(e){}
  const gItems=gevs.map(g=>({id:'g_'+g.id,title:g.title,event_date:g.event_date,event_time:g.event_time,event_type:'구글',source:'google'}));
  const allEv=[...(evs||[]),...gItems];
  const byDate={};allEv.forEach(e=>{const s=e.event_date,en=e.end_date||e.event_date;if(en<=s){(byDate[s]=byDate[s]||[]).push(e);}else{dateRange(s,en).forEach(d=>{(byDate[d]=byDate[d]||[]).push(e);});}});
  const fd=new Date(calY,calM,1).getDay();const today=todayStr();const DOW=['일','월','화','수','목','금','토'];
  let cells='';
  for(let i=0;i<42;i++){const dn=i-fd+1;let out=false,cd=dn,cy=calY,cm=calM;
    if(dn<1){out=true;cd=new Date(calY,calM,0).getDate()+dn;cm=calM-1;if(cm<0){cm=11;cy--;}}
    else if(dn>lastDay){out=true;cd=dn-lastDay;cm=calM+1;if(cm>11){cm=0;cy++;}}

/* ---------- 할 일 ---------- */
const WD=['일','월','화','수','목','금','토'];
function todayWeekday(){return new Date().getDay();}
async function fetchTodoState(){
  const {data:defs}=await sb.from('todos').select('*').eq('employee_id',me.id).order('created_at');
  const {data:comps}=await sb.from('todo_completions').select('todo_id').eq('employee_id',me.id).eq('done_date',todayStr());
  return {defs:defs||[],compSet:new Set((comps||[]).map(c=>c.todo_id))};
}
function applicableToday(t){
  if(t.start_date && t.start_date>todayStr())return false;
  if(t.recur_type==='daily')return true;
  if(t.recur_type==='weekly')return t.weekday===todayWeekday();
  if(t.recur_type==='monthly')return t.weekday===new Date().getDate();
  return !t.done;
}
function todoChecked(t,compSet){return t.recur_type==='project'?!!t.done:compSet.has(t.id);}
function todoTag(t){return t.recur_type==='daily'?'데일리':t.recur_type==='weekly'?('매주 '+WD[t.weekday]+'요일'):t.recur_type==='monthly'?('매월 '+t.weekday+'일'):'프로젝트';}
function sortByPrio(a){const r={'높음':0,'보통':1,'낮음':2};return a.slice().sort((x,y)=>(r[x.priority]??1)-(r[y.priority]??1));}
function prioPill(t){const p=t.priority||'보통';const m={'높음':'#D64545','보통':'#2E75B6','낮음':'#8A93A2'};return `<span class="tdtag" style="color:#fff;background:${m[p]||'#8A93A2'}">${p}</span>`;}
function fieldPill(t){return t.field?`<span class="tdtag" style="color:var(--navy);background:var(--blue-soft)">${esc(t.field)}</span>`:'';}
function dueTag(t,ck){if(!t.due_date)return '';const today=todayStr();const overdue=t.due_date<today&&!ck;const col=overdue?'var(--red)':(t.due_date===today?'var(--amber)':'var(--muted)');const bg=overdue?'var(--red-soft)':(t.due_date===today?'var(--amber-soft)':'var(--bg)');const md=t.due_date.slice(5).replace('-','/');return `<span class="tdtag" style="color:${col};background:${bg}">~${md}</span>`;}
function todoRow2(t,compSet){const ck=todoChecked(t,compSet);
  return `<div class="tditem ${ck?'done':''}"><input type="checkbox" ${ck?'checked':''} onclick="toggleTodo2('${t.id}','${t.recur_type}',${ck})"><div style="flex:1;cursor:pointer" onclick="openTodoModal('${t.id}')"><span style="font-size:14px">${esc(t.content)}</span>${t.note?`<div style="margin-top:3px;white-space:pre-wrap;font-size:11px;line-height:1.35;color:#9AA3B2">${esc(t.note)}</div>`:''}</div>${prioPill(t)}${fieldPill(t)}${dueTag(t,ck)}<span class="tdtag">${todoTag(t)}</span><button class="xmini" onclick="delTodo('${t.id}')">×</button></div>`;}
async function toggleTodo2(id,rt,checked){
  if(rt==='project'){await sb.from('todos').update({done:!checked}).eq('id',id);}
  else if(checked){await sb.from('todo_completions').delete().eq('todo_id',id).eq('employee_id',me.id).eq('done_date',todayStr());}
  else{await sb.from('todo_completions').insert({todo_id:id,employee_id:me.id,done_date:todayStr()});}
  render();
}

function groupTodoByField(items,compSet){
  if(!items.length)return '<div class="empty">오늘 할 일이 없습니다</div>';
  const order=['경영/전략','틱톡','마케팅','매니지먼트','그룹라이브','미지정'];
  const fc={'틱톡':'#111','그룹라이브':'#7F77DD','마케팅':'#D85A30','매니지먼트':'#16A06B','경영/전략':'#2F6BE4','미지정':'#8A93A2'};
  const g={};items.forEach(t=>{const f=t.field||'미지정';(g[f]=g[f]||[]).push(t);});
  const keys=[...order.filter(k=>g[k]),...Object.keys(g).filter(k=>!order.includes(k))];
  return keys.map(k=>`<div class="fldgrp"><div class="fldhd" style="--fc:${fc[k]||'#8A93A2'}"><span style="width:4px;height:13px;border-radius:3px;background:${fc[k]||'#8A93A2'};display:inline-block"></span>${esc(k)}<span class="cnt">${g[k].length}</span></div>${g[k].map(t=>todoRow2(t,compSet)).join('')}</div>`).join('');
}

window._meetAudio=null;let _mr=null,_mrChunks=[],_sr=null,_recOn=false;
async function meetRecToggle(){ if(_recOn) await meetRecStop(); else await meetRecStart(); }
async function meetRecStart(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    _mrChunks=[];_mr=new MediaRecorder(stream);
    _mr.ondataavailable=e=>{if(e.data&&e.data.size)_mrChunks.push(e.data);};
    _mr.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(_mrChunks,{type:_mr.mimeType||'audio/webm'});
      const stat=document.getElementById('mt-recstat'); if(stat)stat.textContent='업로드 중…';
      const path=`${me.id}/${Date.now()}.webm`;
      const up=await sb.storage.from('meeting-audio').upload(path,blob,{contentType:blob.type});
      if(up.error){toast('녹음 저장 실패: '+up.error.message);if(stat)stat.textContent='저장 실패';}
      else{window._meetAudio=path;if(stat)stat.textContent='녹음 저장됨 ('+Math.round(blob.size/1024)+'KB)';}
    };
    _mr.start();
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SR){_sr=new SR();_sr.lang='ko-KR';_sr.continuous=true;_sr.interimResults=false;
      _sr.onresult=e=>{let txt='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)txt+=e.results[i][0].transcript+' ';}if(txt){const c=document.getElementById('mt-content');if(c)c.value=(c.value?c.value+' ':'')+txt.trim();}};
      _sr.onend=()=>{if(_recOn){try{_sr.start();}catch(e){}}};
      try{_sr.start();}catch(e){}
    }
    _recOn=true;
    const b=document.getElementById('mt-recbtn');if(b){b.textContent='■ 녹음 정지';b.style.background='var(--ink)';}
    const stat=document.getElementById('mt-recstat');if(stat)stat.textContent='녹음 중…';
  }catch(err){toast('마이크 접근 실패: '+(err.message||err));}
}
async function meetRecStop(){
  _recOn=false;
  if(_sr){try{_sr.stop();}catch(e){}_sr=null;}
  if(_mr&&_mr.state!=='inactive'){try{_mr.stop();}catch(e){}}
  const b=document.getElementById('mt-recbtn');if(b){b.textContent='● 녹음 시작';b.style.background='var(--red)';}
}

    <div class="field" id="ar-peoplebox" style="display:${visVal==='지정'?'':'none'}"><label>공개 사람 선택</label><div>${peopleChecks}</div></div>
    <div class="field"><label>코멘트</label><textarea id="ar-note" rows="2">${editing&&editing.note?esc(editing.note):''}</textarea></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button onclick="arcModal=false;arcEdit=null;render()" style="background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer">취소</button>${editing?`<button class="ap" onclick="saveArchive()">수정 저장</button>`:`<button class="ap" onclick="addArchive()">저장</button>`}</div>
  </div></div>`:'';
  return `<div style="max-width:760px;margin:0 auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h2 class="sec" style="margin:0">자료 · 메뉴얼 (${(arc||[]).length})</h2>
      <button onclick="arcEdit=null;arcModal=true;render()" style="background:var(--blue);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer">+ 추가</button>
    </div>
    <div class="card">${arows}</div>
  </div>${modal}`;
}
async function addArchive(){
  const t=$('ar-title').value.trim();if(!t){toast('제목을 입력하세요');return;}
  const vis=$('ar-vis')?$('ar-vis').value:'전체';
  let target_depts=null,target_people=null;
  if(vis==='부서'){target_depts=[...document.querySelectorAll('.ar-dept:checked')].map(c=>c.value);if(!target_depts.length){toast('공개할 부서를 선택하세요');return;}}
  if(vis==='지정'){target_people=[...document.querySelectorAll('.ar-person:checked')].map(c=>c.value);if(!target_people.length){toast('공개할 사람을 선택하세요');return;}}
  let file_path=null,file_name=null;
  const fi=$('ar-file');
  if(fi&&fi.files&&fi.files[0]){const f=fi.files[0];const ext=(f.name.split('.').pop()||'dat').toLowerCase();file_path=`${me.id}/${Date.now()}.${ext}`;file_name=f.name;const up=await sb.storage.from('archive-files').upload(file_path,f,{contentType:f.type});if(up.error){toast('파일 업로드 실패: '+up.error.message);return;}}
  const {error}=await sb.from('archives').insert({title:t,category:$('ar-cat').value,impact:Number($('ar-impact').value||3),url:$('ar-url').value,note:$('ar-note').value,file_path,file_name,visibility:vis,target_depts,target_people,created_by:me.id});
  if(error){toast('오류: '+error.message);return;}
  arcModal=false;toast('자료가 추가되었습니다');render();
}
function startArcEdit(id){arcEdit=id;arcModal=true;render();}
async function saveArchive(){
  const t=$('ar-title').value.trim();if(!t){toast('제목을 입력하세요');return;}
  const vis=$('ar-vis')?$('ar-vis').value:'전체';
  let target_depts=null,target_people=null;
  if(vis==='부서'){target_depts=[...document.querySelectorAll('.ar-dept:checked')].map(c=>c.value);if(!target_depts.length){toast('공개할 부서를 선택하세요');return;}}
  if(vis==='지정'){target_people=[...document.querySelectorAll('.ar-person:checked')].map(c=>c.value);if(!target_people.length){toast('공개할 사람을 선택하세요');return;}}
  const upd={title:t,category:$('ar-cat').value,impact:Number($('ar-impact').value||3),url:$('ar-url').value,note:$('ar-note').value,visibility:vis,target_depts,target_people};
  const fi=$('ar-file');
  if(fi&&fi.files&&fi.files[0]){const f=fi.files[0];const ext=(f.name.split('.').pop()||'dat').toLowerCase();const path=`${me.id}/${Date.now()}.${ext}`;const up=await sb.storage.from('archive-files').upload(path,f,{contentType:f.type});if(up.error){toast('파일 업로드 실패: '+up.error.message);return;}upd.file_path=path;upd.file_name=f.name;}
  const {error}=await sb.from('archives').update(upd).eq('id',arcEdit);
  if(error){toast('오류: '+error.message);return;}
  arcModal=false;arcEdit=null;toast('수정되었습니다');render();
}
async function openArchiveFile(path){const {data,error}=await sb.storage.from('archive-files').createSignedUrl(path,180);if(error||!data){toast('파일을 열 수 없습니다');return;}window.open(data.signedUrl,'_blank');}
async function delArchive(id){await sb.from('archives').delete().eq('id',id);render();}

/* ---------- 마이페이지 ---------- */
async function viewMyPage(){
  const {data:{user}}=await sb.auth.getUser();
  return `<h2 class="sec">내 정보</h2><div class="card" style="max-width:520px">
    <div class="row"><div class="meta">이름</div><div class="ttl">${esc(me.name||'')}</div></div>
    <div class="row"><div class="meta">이메일</div><div class="ttl">${esc(user?user.email:'')}</div></div>
    <div class="row"><div class="meta">부서 · 직급</div><div class="ttl">${esc(me.dept||'')} ${esc(me.role||'')}${me.is_admin?' · 관리자':''}</div></div>
  </div>
  <h2 class="sec">비밀번호 변경</h2><div class="card" style="max-width:520px">
    <div class="field"><label>새 비밀번호</label><input type="password" id="np1" placeholder="새 비밀번호 (8자 이상 권장)"></div>
    <div class="field"><label>새 비밀번호 확인</label><input type="password" id="np2" placeholder="다시 입력"></div>
    <button class="submit" onclick="changePw()">비밀번호 변경</button>
    <div class="meta" id="pwmsg" style="margin-top:10px"></div>
  </div>`;
}
async function changePw(){
  const a=$('np1').value,b=$('np2').value,m=$('pwmsg');m.style.color='var(--muted)';m.textContent='';
  if(!a||a.length<6){m.style.color='var(--red)';m.textContent='6자 이상 입력하세요';return;}
  if(a!==b){m.style.color='var(--red)';m.textContent='두 비밀번호가 일치하지 않습니다';return;}
  const {error}=await sb.auth.updateUser({password:a});
  if(error){m.style.color='var(--red)';m.textContent='오류: '+error.message;return;}
  m.style.color='var(--green)';m.textContent='✓ 비밀번호가 변경되었습니다';$('np1').value='';$('np2').value='';
}

/* ---------- 로그인 ---------- */
async function doLogin(){
  const email=$('email').value.trim(),pw=$('pw').value;const m=$('lmsg');m.textContent='';
  if(!email||!pw){m.textContent='이메일과 비밀번호를 입력하세요';return;}
  $('loginBtn').disabled=true;$('loginBtn').textContent='로그인 중…';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  $('loginBtn').disabled=false;$('loginBtn').textContent='로그인';
  if(error){m.textContent='로그인 실패: '+error.message;return;}
  afterLogin(data.user);
}
$('loginBtn').onclick=doLogin;
$('googleBtn').onclick=async()=>{
  const m=$('lmsg');m.textContent='';
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin,scopes:'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/gmail.labels',queryParams:{hd:'homifactory.com',prompt:'consent',access_type:'offline'}}});
  if(error){m.textContent='구글 로그인 실패: '+error.message;}
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
$('logout').onclick=async()=>{await sb.auth.signOut();showLogin();};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='td-in')addTodo();});
sb.auth.getSession().then(({data})=>{if(data.session){if(data.session.provider_token)window.gToken=data.session.provider_token;afterLogin(data.session.user);}});
sb.auth.onAuthStateChange((ev,session)=>{if(session&&session.provider_token)window.gToken=session.provider_token;});
</script>
